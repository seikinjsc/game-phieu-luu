# Đẩy dist/game.html lên GitHub Pages mỗi khi push nhánh main.
# Pages phục vụ index.html ở gốc → sao game.html thành index.html trong artifact.
name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm run build` nay tự sinh dist/index.html (trang chọn game) qua tools/trang-chu.mjs,
      # nên KHÔNG sao game.html thành index.html nữa. Muốn gốc trang lại là game 60 cửa thì
      # bỏ `node tools/trang-chu.mjs` khỏi script build và thêm lại dòng cp ở đây.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
