# Mỗi lần push / pull request: cài, lint, kiểm thử + cân bằng, đóng gói.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:all # test + hud-check + balance
      - run: npm run build
      # Tải về được cả hai game để thử ngay, không cần chờ deploy.
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: |
            dist/index.html
            dist/game.html
            dist/mecung.html
            dist/multi.html
