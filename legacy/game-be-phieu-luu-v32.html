    } else {
      const top=CEIL3;
      ctx.globalAlpha=.75+.25*Math.abs(Math.sin(G.t*24));
      if(skin===1){ for(let j=top;j<GY;j+=16) px(pl.x-16,j,32,16,(j/16|0)%2?'#4DD9FF':'#BFF3FF'); }
      else{
        ctx.fillStyle='rgba(80,220,255,.35)'; ctx.fillRect(pl.x-28,top,56,GY-top);
        ctx.fillStyle='#4DD9FF'; ctx.fillRect(pl.x-15,top,30,GY-top);
        ctx.fillStyle='#EAFBFF'; ctx.fillRect(pl.x-6,top,12,GY-top);
      }
      ctx.globalAlpha=1;
    }
    return;
  }
  const sea=isSea();
  if(sea){
    if(pl.st==='warn'){
      const a=.3+.4*Math.abs(Math.sin(G.t*14));
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#B44DD9';
      ctx.beginPath(); ctx.ellipse(pl.x,GY+4,34,11,0,0,6.3); ctx.fill(); ctx.restore();
      ctx.strokeStyle='#FFD84D'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(pl.x,GY+4,34,11,0,0,6.3); ctx.stroke();
      ctx.fillStyle='#FFD84D'; ctx.font='900 26px Segoe UI, system-ui, sans-serif';
      ctx.textAlign='center'; ctx.fillText('!',pl.x,GY-16); ctx.textAlign='left';
    } else {
      const h=200*Math.min(1,pl.t/.1)*(pl.t>.6?Math.max(.15,(0.8-pl.t)/0.2):1);
      if(skin===1){ for(let j=0;j<h;j+=16) px(pl.x-20,GY-j-16,40,16,j<60?'#8E3AAE':'#B44DD9'); }
      else{
        ctx.strokeStyle='#8E3AAE'; ctx.lineWidth=34; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(pl.x,GY);
        ctx.quadraticCurveTo(pl.x+Math.sin(G.t*7)*22,GY-h*.55,pl.x+Math.sin(G.t*7)*30,GY-h);
        ctx.stroke();
        ctx.strokeStyle='#B44DD9'; ctx.lineWidth=20; ctx.stroke();
        ctx.fillStyle='#E8B6F0';
        for(let j=20;j<h;j+=26){ ctx.beginPath();
          ctx.arc(pl.x-9+Math.sin(G.t*7)*(j/h)*26,GY-j,5,0,6.3); ctx.fill(); }
      }
    }
    return;
  }
  if(pl.st==='warn'){
    const a=.3+.4*Math.abs(Math.sin(G.t*14));
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#FF3D1E';
    if(skin===1) px(pl.x-30,GY-4,60,12,'#FF3D1E');
    else{ ctx.beginPath(); ctx.ellipse(pl.x,GY+4,32,10,0,0,6.3); ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle='#FFD84D'; ctx.lineWidth=3;
    if(skin===1) ctx.strokeRect(pl.x-30,GY-4,60,12);
    else{ ctx.beginPath(); ctx.ellipse(pl.x,GY+4,32,10,0,0,6.3); ctx.stroke(); }
    ctx.fillStyle='#FFD84D'; ctx.font='900 26px Segoe UI, system-ui, sans-serif';
    ctx.textAlign='center'; ctx.fillText('!',pl.x,GY-16); ctx.textAlign='left';
  } else {
    const h=190*Math.min(1,pl.t/.1)*(pl.t>.6?Math.max(.15,(0.8-pl.t)/0.2):1);
    if(skin===1){
      for(let j=0;j<h;j+=14){
        const w=Math.max(10,52-j*0.18)+((j/14|0)%2?4:-4);
        px(pl.x-w/2,GY-j-14,w,14,j<40?'#FF5A1E':(j<110?'#FF9A2E':'#FFE07A'));
      }
    } else {
      for(let i=0;i<3;i++){
        const w=54-i*15, fl=Math.sin(G.t*22+i*2)*7, hh=h-i*22;
        ctx.fillStyle=['#FF5A1E','#FF9A2E','#FFE07A'][i];
        ctx.beginPath(); ctx.moveTo(pl.x-w/2,GY);
        ctx.quadraticCurveTo(pl.x-w/2+fl,GY-hh*.6,pl.x+fl*.5,GY-hh);
        ctx.quadraticCurveTo(pl.x+w/2-fl,GY-hh*.6,pl.x+w/2,GY);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}

/* Thanh máu trùm nằm GIỮA ĐỈNH màn hình — đúng ô mà cửa thường dùng cho
   thanh quãng đường (cửa trùm không có thanh đó nên ô này trống).
   Trước đây đặt ở giữa đáy nên đè lên thanh giữ ấm / năng lượng. */
const BOSSNAME={kraken:'🐙 THUỶ QUÁI',robot:'🤖 ROBOT CHÚA TỂ',titan:'🧊 MA VƯƠNG BĂNG GIÁ',
  rat:'🐀 CHUỘT CỐNG CHÚA',monkey:'🐵 KHỈ CHÚA',dragon:'🐲 RỒNG'};
function drawBossBar(B){
  // Bề ngang co lại theo chỗ trống còn lại giữa ô điểm (trái) và ô tim (phải),
  // để dù bé có 9 trái tim thanh máu trùm cũng không bao giờ bị đè.
  const side=Math.min(300,54+Math.max(G.maxH,G.hearts)*24);
  const L=222, R=W-14-side;
  const bw=Math.max(190,Math.min(320,R-L-34));
  const bx=L+(R-L-bw)/2;
  ctx.save(); ctx.textBaseline='middle';
  panel(bx-16,12,bw+32,52);
  ctx.fillStyle=skin===1?'#2E1A1A':'#F0D6D6';
  if(skin===1) ctx.fillRect(bx,40,bw,16); else { rr(bx,40,bw,16,7); ctx.fill(); }
  const f=Math.max(0,B.hp/B.max);
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);
  gr.addColorStop(0,'#8A1E1E'); gr.addColorStop(.5,'#E8544F'); gr.addColorStop(1,'#FF8A6B');
  ctx.fillStyle=gr;
  if(skin===1) ctx.fillRect(bx,40,Math.max(5,bw*f),16);
  else { rr(bx,40,Math.max(5,bw*f),16,7); ctx.fill(); }
  const seg=bw/3;
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx+seg,40); ctx.lineTo(bx+seg,56);
  ctx.moveTo(bx+seg*2,40); ctx.lineTo(bx+seg*2,56); ctx.stroke();
  ctx.fillStyle=skin===1?'#FFFFFF':'#22306E';
  ctx.font='900 16px Segoe UI, system-ui, sans-serif'; ctx.textAlign='center';
  ctx.fillText((BOSSNAME[B.kind]||BOSSNAME.dragon)+'  •  '+Math.max(0,B.hp)+'/'+B.max+
    '  •  GĐ '+B.ph+'/3',bx+bw/2,26);
  ctx.font='900 12px Segoe UI, system-ui, sans-serif'; ctx.fillStyle='#FFFFFF';
  ctx.fillText(Math.max(0,B.hp)+'/'+B.max,bx+bw/2,49);
  ctx.textAlign='left'; ctx.restore();
}

function heartPath(r){ctx.beginPath();ctx.moveTo(0,r*.85);
  ctx.bezierCurveTo(-r*1.35,-r*.15,-r*.55,-r*1.15,0,-r*.42);
  ctx.bezierCurveTo(r*.55,-r*1.15,r*1.35,-r*.15,0,r*.85);ctx.closePath();}
function drawItem(it){
  const bob=Math.sin(G.t*4+it.x*.02)*4, y=it.y+bob, big=it.r>20;
  ctx.save();
  if(it.got){ctx.globalAlpha=Math.max(0,1-it.sp/.4);ctx.translate(it.x,y-it.sp*90);}
  else ctx.translate(it.x,y);
  if(skin===1){ if(big){ctx.globalAlpha*=.75+.25*Math.abs(Math.sin(G.t*4));
      px(-it.r-8,-it.r-8,(it.r+8)*2,(it.r+8)*2,'rgba(255,255,255,.13)');}
    const sp2=SPR[it.kind];
    if(sp2) sprite(sp2.rows,big?7:5,sp2.cols);
    else { px(-it.r,-it.r,it.r*2,it.r*2,'#FFD84D'); }
    ctx.restore(); return; }
  if(big){ctx.fillStyle='rgba(255,255,255,'+(.25+.12*Math.sin(G.t*6))+')';
    ctx.beginPath();ctx.arc(0,0,it.r+12,0,6.3);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(0,0,it.r+6,0,6.3);ctx.fill();
  if(it.kind==='star'){ctx.fillStyle='#FFD84D';ctx.strokeStyle='#E8A33D';ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<10;i++){const r=i%2?it.r*.46:it.r,a=-Math.PI/2+i*Math.PI/5;
      ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();}
  else if(it.kind==='cake'){ctx.fillStyle='#C98A46';ctx.beginPath();ctx.ellipse(0,0,it.r,it.r*.86,0,0,6.3);ctx.fill();
    ctx.fillStyle='#E8B36B';ctx.beginPath();ctx.ellipse(0,-3,it.r*.92,it.r*.5,0,0,6.3);ctx.fill();}
  else if(it.kind==='gem'){ctx.fillStyle='#7BE0FF';ctx.strokeStyle='#2AA6D6';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(0,-it.r);ctx.lineTo(it.r*.85,0);ctx.lineTo(0,it.r);ctx.lineTo(-it.r*.85,0);
    ctx.closePath();ctx.fill();ctx.stroke();}
  else if(it.kind==='heart'){const pu=1+.09*Math.sin(G.t*8);ctx.save();ctx.scale(pu,pu);
    ctx.fillStyle='#FF4D79';ctx.strokeStyle='#D42A57';ctx.lineWidth=3;heartPath(it.r*.92);ctx.fill();ctx.stroke();

  else if(it.kind==='shield'){ctx.fillStyle='rgba(140,230,255,.55)';ctx.strokeStyle='#2AA6D6';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,it.r,0,6.3);ctx.fill();ctx.stroke();}
  else if(it.kind==='balloon'){ctx.fillStyle='#FF6B9D';ctx.beginPath();
    ctx.ellipse(0,-4,it.r*.8,it.r*.95,0,0,6.3);ctx.fill();
    ctx.strokeStyle='#8A6A4A';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(0,it.r*.7);ctx.quadraticCurveTo(6,it.r*1.2,0,it.r*1.7);ctx.stroke();}
  else if(it.kind==='fire'){
    const fl=Math.sin(G.t*14)*3;
    ctx.fillStyle='rgba(255,140,60,.35)';
    ctx.beginPath(); ctx.arc(0,0,it.r+10,0,6.3); ctx.fill();
    ctx.fillStyle='#8A5A2E'; ctx.fillRect(-5,4,10,20);
    ctx.fillStyle='#FF5A1E'; ctx.beginPath();
    ctx.moveTo(-13,6); ctx.quadraticCurveTo(-9+fl,-10,0,-22);
    ctx.quadraticCurveTo(9-fl,-10,13,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFD84D'; ctx.beginPath();

  if(G){
    POP.on();
    G.obs.forEach(o=>{
      if(!o.fly && o.type!=='whirl' && o.type!=='gzone' && o.y+o.h>=GY-3)
        contactShadow(o.x+o.w/2,o.w,GY+7);
      drawObs(o); });
    POP.off();
    POP.on(); G.mobs.forEach(m=>{
      if(!m.fly) contactShadow(m.x+m.w/2,m.w,GY+7);
      drawMob(m); }); POP.off();
    POP.on(); G.items.forEach(drawItem); POP.off();
    G.pil.forEach(drawPillar);
    if(G.boss){ POP.on(); drawBoss(G.boss); POP.off(); }
    G.shots.forEach(f=>{
      if(f.banana){
        ctx.save();ctx.translate(f.x,f.y);ctx.rotate(G.t*6);
        ctx.fillStyle='#FFD84D';ctx.beginPath();
        ctx.arc(0,0,f.r,0.6,2.9);ctx.arc(4,-4,f.r,2.9,0.6,true);ctx.closePath();ctx.fill();
        ctx.fillStyle='#8A6A2E';ctx.fillRect(-f.r,-2,5,4);ctx.restore();
      } else if(f.melon){
        ctx.fillStyle='#2E7A3A';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.strokeStyle='#1E5228';ctx.lineWidth=3;
        for(let q=0;q<3;q++){ctx.beginPath();
          ctx.arc(f.x,f.y,f.r,q*1.05-0.4,q*1.05+0.4);ctx.stroke();}
        ctx.fillStyle='rgba(255,255,255,.35)';
        ctx.beginPath();ctx.arc(f.x-6,f.y-7,4,0,6.3);ctx.fill();
      } else if(f.nut){
        ctx.fillStyle='#6E4A28';ctx.beginPath();
        ctx.ellipse(f.x,f.y,f.r,f.r*.78,G.t*9,0,6.3);ctx.fill();
        ctx.fillStyle='#4A3018';ctx.beginPath();
        ctx.ellipse(f.x,f.y,f.r*.5,f.r*.35,G.t*9,0,6.3);ctx.fill();
      } else if(f.flame){
        ctx.fillStyle='rgba(255,110,30,.5)';ctx.beginPath();
        ctx.arc(f.x+8,f.y,f.r*1.5,0,6.3);ctx.fill();
        ctx.fillStyle='#FF5A1E';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.fillStyle='#FFD84D';ctx.beginPath();ctx.arc(f.x-3,f.y,f.r*.5,0,6.3);ctx.fill();
      } else if(f.seed){
        ctx.fillStyle='#8A5F35';ctx.beginPath();
        ctx.ellipse(f.x,f.y,f.r,f.r*.7,G.t*8,0,6.3);ctx.fill();
        ctx.fillStyle='#C4A87A';ctx.beginPath();
        ctx.ellipse(f.x-2,f.y-2,f.r*.4,f.r*.3,G.t*8,0,6.3);ctx.fill();
      } else if(f.web){
        ctx.fillStyle='rgba(240,250,240,.85)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.strokeStyle='rgba(200,220,200,.9)';ctx.lineWidth=2;
        for(let q=0;q<4;q++){ctx.beginPath();
          ctx.moveTo(f.x-Math.cos(q*.79)*f.r,f.y-Math.sin(q*.79)*f.r);
          ctx.lineTo(f.x+Math.cos(q*.79)*f.r,f.y+Math.sin(q*.79)*f.r);ctx.stroke();}
      } else if(f.slime){
        ctx.fillStyle='#8FBF4A';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.fillStyle='#B5E06B';ctx.beginPath();ctx.arc(f.x-4,f.y-4,f.r*.45,0,6.3);ctx.fill();
      } else if(f.snow){
        ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.strokeStyle='#8FB4D8';ctx.lineWidth=3;ctx.stroke();
        ctx.fillStyle='#D8E8F2';ctx.beginPath();ctx.arc(f.x-4,f.y+3,f.r*.4,0,6.3);ctx.fill();
      } else if(f.ice){
        ctx.fillStyle='#BFF0FF';ctx.save();ctx.translate(f.x,f.y);ctx.rotate(G.t*7);
        for(let q=0;q<3;q++){ctx.rotate(1.05);ctx.fillRect(-2,-f.r,4,f.r*2);}
        ctx.restore();
      } else if(f.bolt){
        ctx.fillStyle='rgba(80,220,255,.45)';
        ctx.beginPath();ctx.ellipse(f.x+10,f.y,f.r*1.7,f.r*.7,0,0,6.3);ctx.fill();
        ctx.fillStyle='#4DD9FF';
        ctx.beginPath();ctx.ellipse(f.x,f.y,f.r,f.r*.75,0,0,6.3);ctx.fill();
        ctx.fillStyle='#EAFBFF';
        ctx.beginPath();ctx.ellipse(f.x-2,f.y,f.r*.5,f.r*.4,0,0,6.3);ctx.fill();
      } else if(f.ink){
        ctx.fillStyle='rgba(40,10,60,.9)';
        ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.fillStyle='rgba(150,60,190,.8)';
        ctx.beginPath();ctx.arc(f.x+4,f.y-3,f.r*.55,0,6.3);ctx.fill();
        ctx.fillStyle='rgba(40,10,60,.35)';
        ctx.beginPath();ctx.arc(f.x+f.r*1.2,f.y+2,f.r*.6,0,6.3);ctx.fill();
      } else {
        ctx.fillStyle='#FF8A3D';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
        ctx.fillStyle='#FFE07A';ctx.beginPath();ctx.arc(f.x+3,f.y-2,f.r*.5,0,6.3);ctx.fill();}});
    if(skin===1){ctx.globalAlpha=.25;px(KX-22,GY+2,44,7,'#000');ctx.globalAlpha=1;}
    else{ctx.fillStyle='rgba(0,0,0,.16)';
      const sh=Math.max(8,26-(GY-G.kid.y)/8);
      ctx.beginPath();ctx.ellipse(KX,GY+8,sh,7,0,0,6.3);ctx.fill();}
    POP.on();
    drawKid(KX,G.kid.y,G.kid.ph,G.kid.air,G.inv>0&&Math.floor(G.inv*10)%2===0,G.pw);
    POP.off();
    if(G.mvL||G.mvR){ ctx.globalAlpha=.5; ctx.fillStyle='#FFD84D';
      const ax=G.mvR?KX+46:KX-46, s2=G.mvR?1:-1;
      ctx.beginPath(); ctx.moveTo(ax,G.kid.y-46); ctx.lineTo(ax-14*s2,G.kid.y-58);
      ctx.lineTo(ax-14*s2,G.kid.y-34); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
    if(G.mvD&&G.kid.air){ ctx.globalAlpha=.55; ctx.fillStyle='#7BE0FF';
      ctx.fillRect(KX-4,G.kid.y+4,8,26); ctx.globalAlpha=1; }
    if(ADM.hb){
      ctx.strokeStyle='#00FF88'; ctx.lineWidth=2;
      const UPh=ST[G.si].space&&G.gv<0;
      ctx.strokeRect(KX-16, UPh?G.kid.y+6:G.kid.y-76, 32, 70);
      ctx.strokeStyle='#FF4D6E';
      G.obs.forEach(o=>{ if(o.per===undefined||o.act) ctx.strokeRect(o.x,o.y,o.w,o.h); });
      ctx.strokeStyle='#FFD84D';
      G.mobs.forEach(m=>ctx.strokeRect(m.x,m.y,m.w,m.h));
      if(G.boss){const B=G.boss;ctx.strokeStyle='#FF8A3D';ctx.strokeRect(B.x-70,B.y-46,140,92);}
    }
    G.fx.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/f.max);
      if(skin===1)px(f.x-f.r,f.y-f.r,f.r*2,f.r*2,f.c);
      else{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();}});
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function draw(){
  if(SP.on){ drawSplit(); return; }
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.clearRect(0,0,W,H);
  drawWorld();
  if(scr==='play'||scr==='pause') drawHUD();
}
/* ═══ TAY CẦM (Gamepad API) — chơi + duyệt menu bằng tay cầm, không thêm thư viện ═══
   TRONG MÀN CHƠI: D-pad/cần đi·ngồi · ✕/◯ nhảy · ▢/△ đánh · Start tạm dừng · Select chơi lại.
   TRONG MENU (bản đồ/cửa hàng/cài đặt/kết quả/tạm dừng): D-pad di CON TRỎ giữa các nút đang
   hiện · ✕ chọn · ◯ quay lại · △ mở cài đặt. Không viết lại logic menu — chỉ dời focus và
   gọi .click() của nút có sẵn, nên mọi màn nút-DOM đều dùng được.
   ponytail: theo "standard mapping"; tay cầm lạ khác chỉ số nút → sửa các b[...] bên dưới. */
const padPrev={}, padHeld={L:0,R:0,D:0};
const padOn=b=>!!(b&&b.pressed);
const keyTap=code=>document.dispatchEvent(new KeyboardEvent('keydown',{code}));
// Các nút đang bấm được trên màn menu đang hiển thị (bỏ nút ẩn/khoá).
function padScreenBtns(){
  const el=SCRS.map(id=>document.getElementById(id)).find(e=>e&&!e.classList.contains('hide'));
  return el?[...el.querySelectorAll('button')].filter(b=>b.offsetParent&&!b.disabled):[];
}
// Dời con trỏ theo hình học: chọn nút gần nhất về hướng bấm (ưu tiên cùng hàng/cột).
function padFocusMove(dir){
  const btns=padScreenBtns(); if(!btns.length) return;
  const cur=document.activeElement;
  if(!btns.includes(cur)){ btns[0].focus(); return; }
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null, bd=1e9;
  for(const q of btns){ if(q===cur) continue;
    const t=q.getBoundingClientRect(), dx=t.left+t.width/2-cx, dy=t.top+t.height/2-cy;
    let a,p;
    if(dir==='L'){ if(dx>-4)continue; a=-dx; p=Math.abs(dy); }
    else if(dir==='R'){ if(dx<4)continue; a=dx; p=Math.abs(dy); }
    else if(dir==='U'){ if(dy>-4)continue; a=-dy; p=Math.abs(dx); }
    else { if(dy<4)continue; a=dy; p=Math.abs(dx); }
    const s=a+p*2; if(s<bd){ bd=s; best=q; }
  }
  (best||btns[0]).focus();
}
function padBack(){
  for(const id of ['backBtn','setBackBtn']){ const e=document.getElementById(id);
    if(e&&e.offsetParent){ e.click(); return; } }
  if(scr==='pause') resumeGame();
}
function pollPad(){
  const gp=(navigator.getGamepads?navigator.getGamepads():[]).find(p=>p); if(!gp) return;
  const ae=document.activeElement;                     // đang gõ chữ (ô lưu tên…) → nhường bàn phím
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  const b=gp.buttons, ax=gp.axes, X=ax[0]||0, Y=ax[1]||0, DZ=.4, P=padPrev;
  const jb=padOn(b[1])||padOn(b[3])||padOn(b[12]), abb=padOn(b[0])||padOn(b[2]); // ◯/△/D-pad↑ nhảy · ✕/▢ đánh
  const dir={L:padOn(b[14])||X<-DZ, R:padOn(b[15])||X>DZ, U:padOn(b[12])||Y<-DZ, D:padOn(b[13])||Y>DZ};
  if(scr==='play'){
    const _spSwap=SP.on&&SP.g2&&!SP.g2.done, _svG=G; if(_spSwap)G=SP.g2;  // chia màn: tay cầm = Người 2
    if(dir.L!==!!padHeld.L){ padHeld.L=dir.L?1:0; setMove('L',padHeld.L); }
    if(dir.R!==!!padHeld.R){ padHeld.R=dir.R?1:0; setMove('R',padHeld.R); }
    if(dir.D!==!!padHeld.D){ padHeld.D=dir.D?1:0; setMove('D',padHeld.D); }
    if(jb&&!P.jb) jump();  if(!jb&&P.jb) release();     // ◯/△/D-pad↑ nhảy (giữ để nhảy cao)
    if(abb&&!P.ab) attack();                            // ✕/▢ đánh
    if(_spSwap)G=_svG;
    if(padOn(b[9])&&!P.start) keyTap('Escape');         // Start tạm dừng
    if(padOn(b[8])&&!P.sel)   keyTap('KeyR');           // Select chơi lại
  } else {                                              // ── đang ở menu ──
    if(padHeld.L||padHeld.R||padHeld.D){ setMove('L',0);setMove('R',0);setMove('D',0); padHeld.L=padHeld.R=padHeld.D=0; }
    if(dir.L&&!P.dL) padFocusMove('L');  if(dir.R&&!P.dR) padFocusMove('R');
    if(dir.U&&!P.dU) padFocusMove('U');  if(dir.D&&!P.dD) padFocusMove('D');
    if(padOn(b[1])&&!P.b1){ const btns=padScreenBtns(), cur=document.activeElement;   // ◯ chọn
      btns.includes(cur)?cur.click():(btns[0]&&btns[0].focus()); }
    if(padOn(b[0])&&!P.b0) padBack();                   // ✕ quay lại
    if(padOn(b[3])&&!P.b3){ const s=document.getElementById('setBtn');                // △ mở cài đặt
      if(s&&s.offsetParent&&scr!=='set') s.click(); }
  }
  P.jb=jb; P.ab=abb; P.b0=padOn(b[0]); P.b1=padOn(b[1]); P.b3=padOn(b[3]);
  P.start=padOn(b[9]); P.sel=padOn(b[8]);
  P.dL=dir.L; P.dR=dir.R; P.dU=dir.U; P.dD=dir.D;
}
// Vòng sáng cho nút đang chọn bằng tay cầm — để bé thấy con trỏ.
if(document.head) document.head.insertAdjacentHTML('beforeend','<style>'
  +'#mapScr button:focus,#shopScr button:focus,#resScr button:focus,'
  +'#pauseScr button:focus,#setScr button:focus,#vsScr button:focus'
  +'{outline:4px solid #ffcc00;outline-offset:2px}</style>');
let last=0;
function loop(ts){
  let dt=Math.min(.033,last?(ts-last)/1000:.016); last=ts;
  if(VS.on||SP.on) dt=1/60;                          // đấu/chia màn: nhịp cố định → sinh giống hệt
  pollPad();
  if(SP.on){ dualSim(dt); }                          // chia màn: chạy cả hai người
  else if(scr==='play'&&G) update(dt);
  else if(scr!=='pause'){ demoX+=60*dt; if(G) G.worldX=demoX; }
  draw(); requestAnimationFrame(loop);
}
(async function init(){ await load(); refreshMap(); applySkin(); show('mapScr'); requestAnimationFrame(loop); })();
})();
</script>
