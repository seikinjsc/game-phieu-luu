<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bé Phiêu Lưu - 60 Cửa Ải</title>
<style>
  :root{--navy:#22306E;--pink:#E8447F;--gold:#FFB300;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#BFE9FF,#EAF8FF);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 10px 22px;
    color:#22242B;-webkit-tap-highlight-color:transparent;}
  h1{font-size:1.7rem;color:var(--navy);font-weight:900;letter-spacing:-1px;text-align:center;}
  .sub{font-size:.95rem;color:#5a6376;margin:2px 0 10px;text-align:center;}
  .stage{position:relative;width:100%;max-width:900px;border-radius:20px;overflow:hidden;
    box-shadow:0 10px 34px rgba(30,60,110,.28);background:#8FD9FF;touch-action:manipulation;}
  .stage.mc{border-radius:6px;}
  canvas{display:block;width:100%;height:auto;}
  .stage.mc canvas{image-rendering:pixelated;}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:rgba(252,253,255,.94);text-align:center;padding:8px 10px;overflow:auto;}
  #mapScr{gap:4px;}
  #mapScr h2{font-size:clamp(.95rem,2.8vw,1.35rem);}
  #mapScr .sk{padding:5px 12px;font-size:clamp(.7rem,1.9vw,.9rem);border-width:3px;}
  #mapScr .coins{font-size:clamp(.85rem,2.2vw,1.05rem);}
  #mapScr .big{padding:9px 26px;font-size:clamp(.85rem,2.4vw,1.1rem);box-shadow:0 4px 0 #A62B57;}
  #mapScr p{font-size:clamp(.65rem,1.8vw,.85rem);line-height:1.45;}
  .ov.hide{display:none;}
  .ov h2{font-size:clamp(1.1rem,3.5vw,1.9rem);color:var(--navy);font-weight:900;}
  .ov p{font-size:clamp(.78rem,2.2vw,1rem);color:#4b5568;font-weight:600;}
  .pick{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
  .sk{padding:7px 14px;font-size:clamp(.75rem,2.1vw,.95rem);font-weight:800;border:3px solid #cfd8e6;
    background:#fff;border-radius:11px;cursor:pointer;color:#5a6376;}
  .sk.on{border-color:#3E8E33;background:#3E8E33;color:#fff;}
  .coins{font-weight:900;color:#B87300;font-size:clamp(.95rem,2.6vw,1.2rem);}
  .gates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:730px;width:100%;}
  .gate{aspect-ratio:1;border-radius:9px;border:2px solid #d6deea;background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    font-weight:900;color:var(--navy);font-size:clamp(.72rem,1.7vw,1.05rem);padding:1px;
    overflow:hidden;line-height:1.05;}
  .gate small{font-size:.5rem;font-weight:700;color:#8a94a6;line-height:1;display:block;
    max-height:2em;overflow:hidden;padding:0 1px;}
  .gate.ok{background:#E8F8EA;border-color:#4CAF50;}
  .gate.lock{background:#EEF1F5;color:#b3bcc9;cursor:not-allowed;border-color:#e3e8ef;}
  .gate.boss{background:#FFF0E6;border-color:#FF6B35;color:#D2400A;}
  .gate.wet{background:#E8F6FF;border-color:#4AA8D8;color:#0F5C82;}
  .gate.spc{background:#F1EBFF;border-color:#8A5AD8;color:#4A2E8E;}
  .gate.icy{background:#E8F8FF;border-color:#4DC8FF;color:#0E5E82;}
  .gate.sew{background:#EFEFE4;border-color:#7A8250;color:#4A5226;}
  .gate.jgl{background:#E6F6E0;border-color:#4E9E3A;color:#255A1E;}
  .gate.jgl.ok{background:#DFF6EA;border-color:#3FA86E;}
  .gate.jgl.lock{background:#EEF1F5;color:#b3bcc9;border-color:#e3e8ef;}
  .worldhead.jgl{color:#255A1E;}
  .gate.sew.ok{background:#DFF6EA;border-color:#3FA86E;}
  .gate.sew.lock{background:#EEF1F5;color:#b3bcc9;border-color:#e3e8ef;}
  .worldhead.sew{color:#4A5226;}
  .gate.icy.ok{background:#DFF6EA;border-color:#3FA86E;}
  .gate.icy.lock{background:#EEF1F5;color:#b3bcc9;border-color:#e3e8ef;}
  .worldhead.ice{color:#0E5E82;}
  .wtab{padding:6px 13px;font-size:clamp(.68rem,1.8vw,.85rem);font-weight:800;
    border:3px solid #cfd8e6;background:#fff;border-radius:10px;cursor:pointer;color:#5a6376;}
  .wtab.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  .wtab.lock{opacity:.5;cursor:not-allowed;}
  .gate.spc.ok{background:#DFF6EA;border-color:#3FA86E;}
  .gate.spc.lock{background:#EEF1F5;color:#b3bcc9;border-color:#e3e8ef;}
  .worldhead.spc{color:#4A2E8E;}
  .gate.wet.ok{background:#DFF6EA;border-color:#3FA86E;}
  .gate.wet.lock{background:#EEF1F5;color:#b3bcc9;border-color:#e3e8ef;}
  .worldhead{grid-column:1/-1;font-size:clamp(.62rem,1.5vw,.78rem);font-weight:900;color:#5a6376;
    text-align:left;padding:2px 2px 0;letter-spacing:.2px;}
  .worldhead.sea{color:#0F5C82;}
  .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .big{padding:12px 34px;font-size:clamp(.95rem,2.8vw,1.3rem);font-weight:900;background:var(--pink);
    color:#fff;border:none;border-radius:99px;cursor:pointer;box-shadow:0 5px 0 #A62B57;}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #A62B57;}
  .ghost{padding:10px 22px;font-size:.95rem;font-weight:800;background:#fff;color:var(--navy);
    border:3px solid var(--navy);border-radius:99px;cursor:pointer;}
  .shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:860px;width:100%;}
  @media(max-width:700px){.shopgrid{grid-template-columns:repeat(2,1fr);}}
  .sitem{background:#fff;border:3px solid #e2e8f1;border-radius:13px;padding:8px;text-align:left;
    font-size:clamp(.72rem,2vw,.88rem);font-weight:700;color:#3d4757;}
  .sitem b{color:var(--navy);display:block;font-size:1.02em;}
  .buy{margin-top:5px;width:100%;padding:7px;border:none;border-radius:9px;background:var(--gold);
    color:#fff;font-weight:900;cursor:pointer;font-size:.85rem;}
  .buy:disabled{background:#d7dde6;color:#98a2b2;cursor:default;}
  .buy.own{background:#4CAF50;}
  .topbar{width:100%;max-width:900px;display:flex;align-items:center;gap:7px;margin-bottom:7px;}
  .tbspacer{flex:1;}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fff;border-radius:12px;padding:7px 12px;width:100%;max-width:430px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);font-weight:800;color:#3d4757;
    font-size:clamp(.75rem,2vw,.95rem);}
  .setrow .lbl{display:flex;align-items:center;gap:7px;}
  .tg{border:none;border-radius:99px;padding:6px 16px;font-weight:900;cursor:pointer;
    font-size:.82rem;min-width:74px;}
  .tg.on{background:#2F7A36;color:#fff;}
  .tg.off{background:#D8DEE8;color:#4A5464;}
  .tg.pick{background:var(--navy);color:#fff;}
  .danger{background:#E8544F;color:#fff;}
  .ghost.shopres{border-color:#B87300;color:#B87300;background:#FFF8E8;}
  .btnquit{padding:11px 26px;font-size:1rem;font-weight:800;background:#E8544F;color:#FFFFFF;
    border:none;border-radius:99px;cursor:pointer;box-shadow:0 4px 0 #A62F2B;white-space:nowrap;}
  .btnquit:active{transform:translateY(3px);box-shadow:0 1px 0 #A62F2B;}
  .admbox{background:#12182A;border-radius:14px;padding:10px 12px;width:100%;max-width:470px;
    color:#CFE0FF;font-weight:700;font-size:clamp(.72rem,1.9vw,.88rem);}
  .admbox .setrow{background:#1E2740;color:#CFE0FF;box-shadow:none;margin-bottom:6px;}
  .admbox .tg.off{background:#33405E;color:#DCE6F8;}
  .keylist{width:100%;max-width:430px;background:#fff;border-radius:12px;padding:8px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .keyrow{display:flex;justify-content:space-between;gap:10px;font-size:clamp(.66rem,1.8vw,.82rem);
    font-weight:700;color:#5a6376;padding:3px 0;border-bottom:1px solid #eef2f7;}
  .keyrow:last-child{border-bottom:none;}
  .keyrow b{color:var(--navy);font-family:monospace;letter-spacing:.3px;}
  .codebox{width:100%;max-width:430px;font-size:.62rem;font-family:monospace;padding:6px 8px;
    border:3px solid #cfd8e6;border-radius:10px;resize:none;word-break:break-all;color:#3d4757;}
  .pwin{padding:8px 12px;border-radius:10px;border:3px solid #cfd8e6;font-size:.95rem;
    font-weight:700;width:180px;text-align:center;}
  .numin{width:70px;padding:6px;border-radius:9px;border:2px solid #33405E;background:#0E1424;
    color:#fff;font-weight:900;text-align:center;font-size:1rem;}
  .admbadge{background:#E8544F;color:#fff;font-weight:900;
    font-size:.72rem;padding:6px 12px;border-radius:99px;letter-spacing:.5px;flex:none;}
  .pausebig{font-size:clamp(1.4rem,4.5vw,2.2rem);font-weight:900;color:var(--navy);}
  .menucol{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:300px;}
  .menucol button{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tool{width:40px;height:40px;border-radius:50%;border:none;background:#FFFFFF;
    font-size:19px;cursor:pointer;box-shadow:0 2px 8px rgba(30,60,110,.18);flex:none;
    transition:.12s;}
  .tool:hover{background:#EAF2FF;transform:translateY(-1px);}
  .tool:active{transform:translateY(1px);}
  .pad{width:100%;max-width:900px;margin-top:12px;display:flex;gap:26px;align-items:center;
    justify-content:center;background:#1B2338;border-radius:22px;padding:12px 16px;
    box-shadow:0 6px 20px rgba(20,30,60,.35);user-select:none;}
  .dpad{position:relative;width:150px;height:150px;flex:none;}
  .dbtn{position:absolute;width:52px;height:52px;border:none;background:#38425F;color:#DDE6F5;
    font-weight:900;cursor:pointer;box-shadow:0 4px 0 #202942;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0;line-height:1;gap:1px;}
  .dbtn span{font-size:17px;line-height:1;}
  .dbtn i{font-size:8px;font-style:normal;font-weight:900;letter-spacing:.2px;
    color:#9FB0D0;line-height:1;}
  .dbtn.hi{background:#5A4A1E;box-shadow:0 4px 0 #3A2E0E;}
  .dbtn.hi i{color:#FFD84D;}
  .dbtn.hi span{color:#FFD84D;}
  .dbtn:active,.dbtn.on{background:#5C6C96;transform:translateY(3px);box-shadow:0 1px 0 #202942;}
  .dup{left:49px;top:0;border-radius:14px 14px 4px 4px;}
  .ddn{left:49px;top:98px;border-radius:4px 4px 14px 14px;}
  .dlf{left:0;top:49px;border-radius:14px 4px 4px 14px;}
  .drt{left:98px;top:49px;border-radius:4px 14px 14px 4px;}
  .dmid{position:absolute;left:49px;top:49px;width:52px;height:52px;background:#38425F;}
  .abtns{position:relative;width:186px;height:150px;flex:none;}
  .ab{position:absolute;width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
    font-size:10px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;
    justify-content:center;line-height:1;padding:0;letter-spacing:.2px;}
  .ab span{font-size:19px;line-height:1;}
  .ab:active{transform:translateY(3px);filter:brightness(1.15);}
  .abT{left:63px;top:0;background:#2FA84F;box-shadow:0 4px 0 #1D6B33;}
  .abL{left:0;top:45px;background:#D94E9E;box-shadow:0 4px 0 #8E2F66;}
  .abR{left:126px;top:45px;background:#E8544F;box-shadow:0 4px 0 #A62F2B;}
  .abB{left:63px;top:90px;background:#3F7BD6;box-shadow:0 4px 0 #27528F;}
  #wrap{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;}
  #wrap:fullscreen{max-width:none;width:100vw;height:100vh;background:#070C18;
    padding:8px;justify-content:center;gap:10px;overflow:hidden;}
  #wrap:fullscreen .topbar{max-width:none;width:min(calc(100vw - 24px), 168vh);margin-bottom:6px;}
  #wrap:fullscreen .tool{background:rgba(255,255,255,.9);}
  #wrap:fullscreen .stage{
    max-width:none; width:auto;
    height:min(calc(100vh - 258px), calc((100vw - 24px) / 1.8));
    aspect-ratio:9 / 5;}
  #wrap:fullscreen .stage canvas{width:100%;height:100%;display:block;}
  #wrap:fullscreen .pad{max-width:none;width:auto;margin-top:0;padding:10px 30px;}
  #wrap:-webkit-full-screen{max-width:none;width:100vw;height:100vh;background:#070C18;
    padding:8px;justify-content:center;gap:10px;overflow:hidden;}
  #wrap:-webkit-full-screen .topbar{max-width:none;width:min(calc(100vw - 24px), 168vh);}
  #wrap:-webkit-full-screen .stage{max-width:none;width:auto;
    height:min(calc(100vh - 258px), calc((100vw - 24px) / 1.8));aspect-ratio:9 / 5;}
  #wrap:-webkit-full-screen .stage canvas{width:100%;height:100%;display:block;}
  #wrap:-webkit-full-screen .pad{max-width:none;width:auto;margin-top:0;padding:10px 30px;}
  @media(max-width:620px){
    .dpad{width:126px;height:126px}.dbtn{width:44px;height:44px}
    .dbtn span{font-size:14px}.dbtn i{font-size:6.5px}
    .dup{left:41px}.ddn{left:41px;top:82px}.dlf{top:41px}.drt{left:82px;top:41px}
    .dmid{left:41px;top:41px;width:44px;height:44px}
    .abtns{width:158px;height:126px}.ab{width:52px;height:52px;font-size:9px}
    .ab span{font-size:16px}
    .abT{left:53px;top:0}.abL{left:0;top:37px}.abR{left:106px;top:37px}.abB{left:53px;top:74px}
    .gate small{display:none}
  }
  .toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(20,24,34,.9);
    color:#fff;padding:9px 18px;border-radius:99px;font-weight:800;font-size:.95rem;z-index:20;
    opacity:0;transition:.25s;pointer-events:none;}
  .toast.on{opacity:1;}
  .conf{position:absolute;width:11px;height:11px;opacity:0;animation:fall 1.6s ease forwards;z-index:9;}
  @keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<h1>Bé Phiêu Lưu — 60 Cửa Ải</h1>
<div class="sub">🌍 → 🌊 → 🚀 → ❄️ → 🕳️ → 🌴 &nbsp;•&nbsp; 60 cửa · 6 trùm cuối</div>

<div id="wrap">
<div class="topbar">
  <div class="admbadge" id="admBadge" style="display:none">🔐 ADMIN</div>
  <div class="tbspacer"></div>
  <button class="tool" id="pauseBtn" title="Tạm dừng" style="display:none">⏸</button>
  <button class="tool" id="setBtn" title="Cài đặt">⚙️</button>
  <button class="tool" id="skinBtn" title="Đổi giao diện">🎨</button>
  <button class="tool" id="fsBtn" title="Toàn màn hình">⛶</button>
</div>
<div class="stage" id="stage">
  <canvas id="cv" width="900" height="500"></canvas>
  <div class="toast" id="toast"></div>

  <div class="ov" id="mapScr">
    <h2>🗺️ Bản đồ phiêu lưu</h2>
    <div class="pick">
      <button class="sk on" data-sk="0">🎀 Doraemon</button>
      <button class="sk" data-sk="1">⛏️ Minecraft</button>
      <button class="sk" data-sk="2">🇻🇳 Làng quê Việt</button>
    </div>
    <div class="coins" id="coinLbl">🪙 0 xu</div>
    <div class="pick" id="worldTabs"></div>
    <div class="gates" id="gates"></div>
    <div class="row">
      <button class="big" id="contBtn" style="display:none">▶ Chơi tiếp</button>
      <button class="big" id="shopBtn">🛒 Cửa hàng</button>
      <button class="ghost" id="setFromMap">⚙️ Cài đặt</button>
    </div>
    <div class="row">
      <button class="big" id="versusBtn">⚔️ Đấu 2 người</button>
    </div>
    <p id="gearLbl"></p>
  </div>

  <div class="ov hide" id="shopScr">
    <h2>🛒 Cửa hàng nâng cấp</h2>
    <div class="coins" id="coinLbl2">🪙 0 xu</div>
    <div class="pick" id="shopTabs"></div>
    <div class="shopgrid" id="shopGrid"></div>
    <button class="ghost" id="backBtn">← Quay lại</button>
  </div>

  <div class="ov hide" id="pauseScr">
    <div class="pausebig">⏸ TẠM DỪNG</div>
    <p id="pauseInfo"></p>
    <div class="menucol">
      <button class="big" id="resumeBtn">▶ Tiếp tục</button>
      <button class="ghost" id="restartBtn">🔄 Chơi lại cửa này</button>
      <button class="ghost" id="setFromPause">⚙️ Cài đặt</button>
      <button class="ghost" id="saveExitBtn">💾 Lưu &amp; thoát ra bản đồ</button>
      <button class="btnquit" id="quitBtn">🚪 Thoát, không lưu</button>
    </div>
  </div>

  <div class="ov hide" id="setScr">
    <h2>⚙️ Cài đặt</h2>
    <div id="setList" style="display:flex;flex-direction:column;gap:6px;align-items:center;width:100%"></div>
    <div id="admPanel"></div>
    <button class="ghost" id="setBackBtn">← Quay lại</button>
  </div>

  <div class="ov hide" id="resScr">
    <div style="font-size:3rem" id="rIcon">🏆</div>
    <h2 id="rTitle"></h2>
    <p id="rBody"></p>
    <div class="row">
      <button class="big" id="nextBtn">Cửa tiếp →</button>
      <button class="ghost shopres" id="shopResBtn">🛒 Cửa hàng</button>
    </div>
    <div class="row">
      <button class="ghost" id="retryBtn">Chơi lại</button>
      <button class="ghost" id="mapBtn">🗺️ Bản đồ</button>
    </div>
  </div>

  <div class="ov hide" id="vsScr">
    <div id="vsCard" style="display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:520px"></div>
  </div>
</div>

<div class="pad">
  <div class="dpad">
    <div class="dmid"></div>
    <button class="dbtn dup" id="bUp"><span>▲</span><i>NHẢY</i></button>
    <button class="dbtn dlf" id="bLeft"><span>◀</span><i>LÙI</i></button>
    <button class="dbtn drt" id="bRight"><span>▶</span><i>TIẾN</i></button>
    <button class="dbtn ddn" id="bDown"><span>▼</span><i id="lbD">ĐÁP</i></button>
  </div>
  <div class="abtns">
    <button class="ab abT" id="bTri"><span>⚔️</span>ĐÁNH</button>
    <button class="ab abL" id="bSqr"><span>⚔️</span>ĐÁNH</button>
    <button class="ab abR" id="bCir"><span>⬆️</span>NHẢY</button>
    <button class="ab abB" id="bCrs"><span>⬆️</span>NHẢY</button>
  </div>
</div>
</div>

<script>
(function(){
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=900,H=500,GY=408,HZ=GY-18,KW=32,KH=76;
const RS=1.5; cv.width=W*RS; cv.height=H*RS;
let KX=180;
let skin=0, scr='map', G=null, demoX=0, prevScr='map';
let mapTab=null, shopTab=null, shopFrom='map';
const SET={music:1,sfx:1,shake:1,help:0,adm:0,diff:1};
const DIFF=[{n:'🧸 Bé',sp:.88,gap:1.18,mhp:0,mob:1.3,pu:.85,boss:.8,hrt:2,shot:.75},
            {n:'⚔️ Thường',sp:1,gap:1,mhp:0,mob:1,pu:1,boss:1,hrt:0,shot:1},
            {n:'💀 Người lớn',sp:1.2,gap:.84,mhp:1,mob:.66,pu:1.35,boss:1.4,hrt:-1,shot:1.45}];
const DF=()=>DIFF[SET.diff];
const ADM={inv:0,o2:0,spd:1,hb:0};
/* ════════════════════════════════════════════════════════════════
   MODULE: MÃ LƯU TIẾN TRÌNH  (save code)
   Mỗi phiên bản game là một tệp riêng nên bộ nhớ tự động KHÔNG dùng
   chung. Mã lưu cho phép chuyển tiến trình sang bản mới / máy khác:
   bản cũ bấm "Lấy mã" → chép chuỗi → bản mới bấm "Nhập mã".
   ════════════════════════════════════════════════════════════════ */
const SAVEVER='BPL1';
function b64e(str){ try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return ''; } }
function b64d(str){ try{ return decodeURIComponent(escape(atob(str))); }catch(e){ return ''; } }
function sumOf(str){ let x=5; for(let i=0;i<str.length;i++) x=(x*33+str.charCodeAt(i))>>>0; return x.toString(36); }
function exportSave(){
  let cl=''; for(let i=1;i<=ST.length;i++) cl+=PG.cleared[i]?'1':'0';
  const d={u:PG.unlocked,c:cl,m:PG.coins,
    g:[PG.weapon,PG.wDur,PG.armor,PG.aDur,PG.boots,PG.bDur,PG.charm,PG.cDur,
       PG.sw,PG.swDur,PG.sa,PG.saDur,PG.fins,PG.fDur,PG.tank,
       PG.aw,PG.awDur,PG.aa,PG.aaDur,PG.jet,PG.jDur,PG.mag,
       PG.iw,PG.iwDur,PG.ia,PG.iaDur,PG.cramp,PG.crDur,PG.torch,
       PG.gw,PG.gwDur,PG.ga,PG.gaDur,PG.grip,PG.grDur,PG.lamp,
       PG.jw,PG.jwDur,PG.ja,PG.jaDur,PG.claw,PG.clDur,PG.coco],
    r:PG.run||null, d:SET.diff};
  const body=b64e(JSON.stringify(d));
  return SAVEVER+'-'+sumOf(body)+'-'+body;
}
function importSave(code){
  code=(code||'').trim().replace(/\s+/g,'');
  const p1=code.split('-');
  if(p1.length<3||p1[0]!==SAVEVER) return {ok:0,msg:'Mã không đúng định dạng'};
  const body=p1.slice(2).join('-');
  if(sumOf(body)!==p1[1]) return {ok:0,msg:'Mã bị sai hoặc thiếu ký tự'};
  let d; try{ d=JSON.parse(b64d(body)); }catch(e){ return {ok:0,msg:'Không đọc được mã'}; }
  if(!d||typeof d.u!=='number') return {ok:0,msg:'Mã không hợp lệ'};
  PG.unlocked=Math.max(1,Math.min(ST.length,d.u));
  PG.cleared={}; if(typeof d.c==='string')
    for(let i=0;i<d.c.length;i++) if(d.c[i]==='1') PG.cleared[i+1]=true;
  PG.coins=Math.max(0,d.m|0);
  const K=['weapon','wDur','armor','aDur','boots','bDur','charm','cDur',
           'sw','swDur','sa','saDur','fins','fDur','tank',
           'aw','awDur','aa','aaDur','jet','jDur','mag',
           'iw','iwDur','ia','iaDur','cramp','crDur','torch',
           'gw','gwDur','ga','gaDur','grip','grDur','lamp',
           'jw','jwDur','ja','jaDur','claw','clDur','coco'];
  if(Array.isArray(d.g)) K.forEach((k,i)=>{ if(typeof d.g[i]==='number') PG[k]=d.g[i]; });
  PG.run=(d.r&&typeof d.r.si==='number')?d.r:null;
  if(typeof d.d==='number') SET.diff=Math.max(0,Math.min(2,d.d));
  save();
  return {ok:1,msg:'Đã khôi phục: mở tới cửa '+PG.unlocked+' • 🪙'+PG.coins};
}
/* ── TIỆN ÍCH LƯU: ô lưu đặt tên (trong máy) + xuất/nhập TỆP ──────────
   Bọc quanh mã BPL1 cho tiện, KHÔNG phải copy chuỗi. Định dạng mã giữ
   nguyên nên ô lưu / tệp đều tương thích với mã cũ và ngược lại. */
const SLOTKEY='adv_slots';
function slotsLoad(){ try{ return JSON.parse(localStorage.getItem(SLOTKEY))||[]; }catch(e){ return []; } }
function slotsStore(list){ try{ localStorage.setItem(SLOTKEY, JSON.stringify(list)); }catch(e){} }
function slotAdd(name){
  const list=slotsLoad();
  const nm=((name||'').trim()) || ('Cửa '+PG.unlocked+' • 🪙'+PG.coins);
  list.unshift({name:nm, code:exportSave(), t:Date.now()});
  slotsStore(list.slice(0,12));                 // giữ tối đa 12 ô, mới nhất lên đầu
  return nm;
}
function slotDel(i){ const list=slotsLoad(); list.splice(i,1); slotsStore(list); }
function slotDate(t){ try{ return new Date(t).toLocaleString('vi-VN',
  {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function saveToFile(){                            // tải mã lưu về máy dưới dạng tệp .txt
  try{
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const fn='be-phieu-luu-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.txt';
    const blob=new Blob([exportSave()],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fn;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); },0);
    return true;
  }catch(e){ return false; }
}
function loadFromFile(onDone){                    // mở hộp chọn tệp rồi nhập
  try{
    const inp=document.createElement('input'); inp.type='file';
    inp.accept='.txt,.save,text/plain'; inp.style.display='none';
    inp.onchange=()=>{ const f=inp.files&&inp.files[0];
      if(!f){ onDone({ok:0,msg:'Chưa chọn tệp'}); return; }
      const rd=new FileReader();
      rd.onload=()=>onDone(importSave(String(rd.result||'')));
      rd.onerror=()=>onDone({ok:0,msg:'Không đọc được tệp'});
      rd.readAsText(f); };
    document.body.appendChild(inp); inp.click();
    setTimeout(()=>{ try{document.body.removeChild(inp);}catch(e){} }, 60000);
  }catch(e){ onDone({ok:0,msg:'Trình duyệt không hỗ trợ mở tệp'}); }
}

let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
/* Mọi tham số đều được kẹp lại: một công thức sai ở đâu đó cũng không
   thể làm Web Audio ném lỗi và giết luôn tiếng của cả game. */
function tone(f,d,ty,v,mus){
  if(mus?!SET.music:!SET.sfx) return;
  const a=ac(); if(!a) return;
  f=+f; d=+d; v=+v;
  if(!isFinite(f)||f<=0) return;
  d=(!isFinite(d))?0.12:Math.max(0.03,Math.min(4,d));
  v=(!isFinite(v)||v<=0)?0.07:Math.min(0.3,v);
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=ty||'square'; o.frequency.value=f;
    const t0=a.currentTime;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+Math.min(0.02,d*0.4));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+d+0.05);
  }catch(e){}
}

(function music(){
  if(!SET.music||scr!=='play'){setTimeout(music,300);return;}
  const s=ST[G.si], step=s.boss?0.15:Math.max(0.11,0.26-0.003*s.n);

  tone(mel[mStep%mel.length]*(s.boss?0.5:1),step*.9,skin===1?'sine':'triangle',.03,1);

function refreshShop(){
  const S=SHOPS();
  if(shopTab===null||shopTab===undefined||PG.unlocked<=S[shopTab].need)
    shopTab=Math.max(0,Math.min(S.length-1,Math.floor((PG.unlocked-1)/10)));
  const tabs=document.getElementById('shopTabs'); tabs.innerHTML='';
  S.forEach((w,i)=>{
    const b=document.createElement('button');
    const ok=PG.unlocked>w.need;
    b.className='wtab '+(shopTab===i?'on':'')+(ok?'':' lock');
    b.textContent=w.t+(ok?'':' 🔒');
    if(ok) b.onclick=()=>{ shopTab=i; refreshShop(); };
    tabs.appendChild(b);
  });
  const grid=document.getElementById('shopGrid'); grid.innerHTML='';
  const cfg=S[shopTab];
  const hd=document.createElement('div'); hd.className='worldhead '+cfg.cls;
  hd.textContent='QUẦY '+cfg.t.toUpperCase()+' — trang bị dùng cho '+cfg.range;
  grid.appendChild(hd);

  function card(title,desc,btns){
    const d=document.createElement('div'); d.className='sitem';
    d.innerHTML='<b>'+title+'</b>'+desc;
    btns.forEach(bt=>{
      const b=document.createElement('button');
      b.className='buy'+(bt.own?' own':''); b.textContent=bt.label;
      b.disabled=!!bt.dis; if(!bt.dis&&bt.fn) b.onclick=bt.fn;
      d.appendChild(b);
    });
    grid.appendChild(d);
  }
  function bar(cur,max){
    if(!max) return '';
    const p=Math.max(0,Math.round(cur/max*100));
    const col=p>50?'#4CAF50':(p>25?'#FFB300':'#E8544F');
    return '<div style="margin-top:4px">Độ bền: <b>'+cur+'/'+max+'</b>'+
      '<div style="height:7px;background:#e6ebf2;border-radius:4px;overflow:hidden;margin-top:2px">'+
      '<div style="height:100%;width:'+p+'%;background:'+col+'"></div></div></div>';
  }
  const done=()=>{ sPU(); save(); refreshShop(); refreshMap(); };

  // ── vũ khí ──
  const wi=PG[cfg.wk], wCur=cfg.W[wi], wMax=cfg.DW[wi];
  let wB=[];
  if(wi+1<cfg.W.length){ const w=cfg.W[wi+1];
    wB.push({label:'Nâng cấp 🪙'+w.cost,dis:PG.coins<w.cost,fn:()=>{
      PG.coins-=w.cost; PG[cfg.wk]=wi+1; PG[cfg.wd]=cfg.DW[wi+1]; done(); toast('Đã có '+w.n+'!');}}); }
  if(wi>0){ const rc=Math.round(wCur.cost*.3);
    wB.push({label:'🔧 Sửa 🪙'+rc,dis:PG.coins<rc||PG[cfg.wd]>=wMax,fn:()=>{
      PG.coins-=rc; PG[cfg.wd]=wMax; done(); toast('Vũ khí như mới!');}}); }
  if(!wB.length) wB=[{label:'✔ Tối đa',own:true,dis:true}];
  card(wCur.ico+' '+wCur.n,
    'Sát thương <b>'+wCur.dmg+'</b> • tầm <b>'+wCur.rng+'px</b><br>Mỗi nhát chém tốn 1 độ bền'+
    bar(PG[cfg.wd],wMax), wB);

  // ── giáp ──
  const ai=PG[cfg.ak], aCur=cfg.A[ai], aMax=cfg.DA[ai];
  let aB=[];
  if(ai+1<cfg.A.length){ const a2=cfg.A[ai+1];
    aB.push({label:'Nâng cấp 🪙'+a2.cost,dis:PG.coins<a2.cost,fn:()=>{
      PG.coins-=a2.cost; PG[cfg.ak]=ai+1; PG[cfg.ad]=cfg.DA[ai+1]; done(); toast('Đã mặc '+a2.n+'!');}}); }
  if(ai>0){ const rc=Math.round(aCur.cost*.3);
    aB.push({label:'🔧 Sửa 🪙'+rc,dis:PG.coins<rc||PG[cfg.ad]>=aMax,fn:()=>{
      PG.coins-=rc; PG[cfg.ad]=aMax; done(); toast('Giáp như mới!');}}); }
  if(!aB.length) aB=[{label:'✔ Tối đa',own:true,dis:true}];
  card(aCur.ico+' '+aCur.n,
    'Tăng <b>+'+aCur.hp+' tim</b> tối đa<br>Trúng đòn tốn 1 độ bền, vỡ thì tụt 1 cấp'+
    bar(PG[cfg.ad],aMax), aB);

  // ── 2 phụ kiện ──
  cfg.ex.forEach(e=>{
    if(e.type==='dur'){
      const has=PG[e.k];
      card(e.ico+' '+e.n, e.d+'<br>Hỏng sau <b>'+e.max+'</b> '+e.wear+
        (has?bar(PG[e.dk],e.max):''),
        has?[{label:'🔧 Sửa 🪙'+e.fix,dis:PG.coins<e.fix||PG[e.dk]>=e.max,fn:()=>{
              PG.coins-=e.fix; PG[e.dk]=e.max; done(); toast(e.n+' như mới!');}}]
           :[{label:'Mua 🪙'+e.cost,dis:PG.coins<e.cost,fn:()=>{
              PG.coins-=e.cost; PG[e.k]=1; PG[e.dk]=e.max; done(); toast('Đã mua '+e.n+'!');}}]);
    } else if(e.type==='lvl'){
      const lv2=PG[e.k], cost=e.costs[lv2];
      card(e.ico+' '+e.n+(lv2?' cấp '+lv2:''), e.d+'<br>'+e.info(),
        lv2<e.costs.length?[{label:'Nâng cấp 🪙'+cost,dis:PG.coins<cost,fn:()=>{
              PG.coins-=cost; PG[e.k]++; done(); toast(e.n+' cấp '+PG[e.k]+'!');}}]
                          :[{label:'✔ Tối đa',own:true,dis:true}]);
    } else {
      card(e.ico+' '+e.n, e.d,
        PG[e.k]?[{label:'✔ Đã có',own:true,dis:true}]
               :[{label:'Mua 🪙'+e.cost,dis:PG.coins<e.cost,fn:()=>{
                  PG.coins-=e.cost; PG[e.k]=1; done(); toast('Đã mua '+e.n+'!');}}]);
    }
  });
  document.getElementById('coinLbl2').textContent='🪙 '+PG.coins+' xu';
}

  if(w===3) return {W:IWEAP,A:IARMOR,wi:PG.iw,ai:PG.ia,wd:'iwDur',ad:'iaDur',DW:DUR.iw,DA:DUR.ia,wk:'iw',ak:'ia'};
  if(w===2) return {W:AWEAP,A:AARMOR,wi:PG.aw,ai:PG.aa,wd:'awDur',ad:'aaDur',DW:DUR.aw,DA:DUR.aa,wk:'aw',ak:'aa'};
  if(w===1) return {W:SWEAP,A:SARMOR,wi:PG.sw,ai:PG.sa,wd:'swDur',ad:'saDur',DW:DUR.sw,DA:DUR.sa,wk:'sw',ak:'sa'};

/* ════════════════════════════════════════════════════════════════
   CHẾ ĐỘ ĐẤU 2 NGƯỜI — luân phiên cùng máy (hot-seat)
   Hai người chơi CÙNG một cửa, CÙNG seed → cùng bố trí vật cản/quái → công bằng.
   - Luồng ngẫu nhiên phần SINH (spawn) tách riêng, chỉ gieo hạt lúc gọi hàm sinh
     → hiệu ứng/khung hình/cách chơi của người này KHÔNG làm lệch màn của người kia.
   - dt cố định khi đấu để nhịp sinh giống hệt giữa hai lượt.
   - KHÔNG đụng tiến trình thật: chụp PG trước trận, trả về sau mỗi lượt & khi xong;
     save() bị tạm khoá trong lúc đấu.
   ════════════════════════════════════════════════════════════════ */
const _realRandom=Math.random;
function _mulberry32(a){ return function(){ a|=0;a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
function _seedFromCode(str){ let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
// HAI luồng gieo hạt RIÊNG: vật cản (course) và quái. Tách ra để việc người chơi đè chết
// quái (làm hàm sinh quái chạy nhiều hơn) KHÔNG làm lệch chuỗi vật cản → course luôn công bằng.
let _gObs=null, _gMob=null;
function seedGameplay(code){ const s=_seedFromCode(code);
  _gObs=_mulberry32(s); _gMob=_mulberry32((s^0x9E3779B9)>>>0); }
function unseedGameplay(){ _gObs=_gMob=null; }
// Gọi hàm sinh với Math.random tạm thay bằng đúng luồng gieo hạt (chỉ khi đang đấu).
// Chia màn: mỗi người chơi có luồng RIÊNG (gieo cùng seed) gắn trên G._gObs/_gMob
// → hai người cùng đường đua đồng thời. Đấu luân phiên: dùng luồng chung _gObs/_gMob.
function seededObs(fn){ const g=SP.on?(G&&G._gObs):_gObs;
  if(!((VS.on||SP.on)&&g)) return fn();
  const r=Math.random; Math.random=g; try{ return fn(); } finally{ Math.random=r; } }
function seededMob(fn){ const g=SP.on?(G&&G._gMob):_gMob;
  if(!((VS.on||SP.on)&&g)) return fn();
  const r=Math.random; Math.random=g; try{ return fn(); } finally{ Math.random=r; } }

const VS={on:false,code:'',si:0,pickSi:0,turn:0,res:[null,null],snap:null};
function vsRandCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<4;i++) s+=A[Math.floor(_realRandom()*A.length)]; return s; }
function vsBtn(txt,cls,fn){ const b=document.createElement('button'); b.className=cls; b.textContent=txt; b.onclick=fn; return b; }
function vsCard(){ const c=document.getElementById('vsCard'); c.innerHTML=''; return c; }
function vsGo(){ show('vsScr'); scr='vs'; }

function vsOpen(){                                  // mở màn thiết lập trận
  VS.on=false; unseedGameplay();

}
function vsRenderSetup(){

  hint.innerHTML='Chia màn — P1: phím mũi tên + ⇧phải/“/” đánh · P2: W A S D + F/⇧trái đánh (hoặc tay cầm)';
  c.appendChild(hint);
  c.appendChild(vsBtn('← Quay lại','ghost',()=>{ refreshMap(); show('mapScr'); scr='map'; }));

}
function vsStart(){
  VS.on=true; VS.code=vsRandCode(); VS.si=VS.pickSi; VS.turn=1; VS.res=[null,null];
  VS.snap=JSON.stringify(PG);
  vsRenderIntro();
}
function vsRenderIntro(){
  const c=vsCard(); const s=ST[VS.si];
  const h=document.createElement('h2'); h.textContent='Lượt Người chơi '+VS.turn; c.appendChild(h);
  const em=document.createElement('div'); em.style.cssText='font-size:2.6rem;margin:4px';
  em.textContent=VS.turn===1?'🔵':'🔴'; c.appendChild(em);
  const p=document.createElement('p');
  p.innerHTML='Cửa <b>'+s.n+'</b> — '+s.name+'<br>Mã đua: <b>'+VS.code+'</b>'+
    (VS.turn===2?'<br>🔵 Người 1: <b>'+(VS.res[0].win?'qua cửa':VS.res[0].dist+'m')+'</b> — cố hơn nhé!':'');
  c.appendChild(p);
  c.appendChild(vsBtn('▶ Người chơi '+VS.turn+' bắt đầu','big',vsBeginRun));
  c.appendChild(vsBtn('✖ Huỷ trận','ghost',vsAbort));
  vsGo();
}
function vsBeginRun(){
  Object.assign(PG, JSON.parse(VS.snap));          // trả gear về gốc → hai lượt công bằng
  seedGameplay(VS.code);                            // cùng seed → cùng màn
  startStage(VS.si);
}
function vsCapture(win,fell){                        // endStage gọi khi đang đấu
  VS.res[VS.turn-1]={ win:!!win, dist:Math.floor(G.dist), coins:G.coins,
    time:Math.round(G.t*10)/10, score:G.score, fell:!!fell };
  unseedGameplay();
  Object.assign(PG, JSON.parse(VS.snap));           // không tiêu gear/xu thật
  if(VS.turn===1){ VS.turn=2; vsRenderIntro(); }
  else { VS.on=false; vsRenderResult(); }
}
function vsCmp(a,b){                                 // >0: a thắng · <0: b thắng · 0: hoà
  if(a.win!==b.win) return a.win?1:-1;
  if(a.win){ if(a.time!==b.time) return a.time<b.time?1:-1; }
  else { if(a.dist!==b.dist) return a.dist>b.dist?1:-1; }
  if(a.coins!==b.coins) return a.coins>b.coins?1:-1;
  return 0;
}
function vsRenderResult(){
  const c=vsCard(); const a=VS.res[0], b=VS.res[1], w=vsCmp(a,b);
  const h=document.createElement('h2'); h.textContent='🏁 Kết quả trận'; c.appendChild(h);
  const win=document.createElement('div'); win.style.cssText='font-size:1.4rem;font-weight:900;margin:6px';
  win.textContent = w>0?'🔵 Người chơi 1 THẮNG!' : w<0?'🔴 Người chơi 2 THẮNG!' : '🤝 Hoà!';
  c.appendChild(win);
  const line=r=>(r.win?'🏆 Qua cửa':'Đi được '+r.dist+'m')+' • ⏱ '+r.time+'s • 🪙'+r.coins+' • ⭐'+r.score;
  const tbl=document.createElement('p');
  tbl.innerHTML='🔵 <b>Người 1:</b> '+line(a)+'<br>🔴 <b>Người 2:</b> '+line(b);
  c.appendChild(tbl);
  c.appendChild(vsBtn('🔁 Đấu lại cửa này','big',()=>{ VS.pickSi=VS.si; vsStart(); }));
  c.appendChild(vsBtn('⚔️ Trận mới','ghost',vsOpen));
  c.appendChild(vsBtn('🗺️ Về bản đồ','ghost',()=>{ vsAbort(); }));
  vsGo();
}
function vsAbort(){
  VS.on=false; unseedGameplay();
  if(VS.snap) Object.assign(PG, JSON.parse(VS.snap));
  refreshMap(); show('mapScr'); scr='map';
}

/* ════════════════════════════════════════════════════════════════
   CHIA ĐÔI MÀN — 2 người 1 máy, CÙNG LÚC, cùng cửa (cùng seed).
   Tái dùng nguyên engine: mỗi khung chạy update() 2 lần bằng cách HOÁN ĐỔI biến
   toàn cục G (g1/g2), rồi vẽ mỗi người vào một nửa màn (trên/dưới).
   Phím: Người 1 = mũi tên (↑nhảy ↓ngồi ◀▶ đi) + ⇧phải/'/'  đánh;
         Người 2 = W A S D (W nhảy S ngồi A/D đi) + F/⇧trái đánh.  (Người 2 cũng có thể tay cầm)
   ════════════════════════════════════════════════════════════════ */
const SP={on:false,code:'',si:0,g1:null,g2:null,res:[null,null],snap:null};
function spSeedPlayer(g,code){ const s=_seedFromCode(code);
  g._gObs=_mulberry32(s); g._gMob=_mulberry32((s^0x9E3779B9)>>>0); }
function startSplit(si){
  SP.on=true; SP.code=vsRandCode(); SP.si=si; SP.res=[null,null]; SP.snap=JSON.stringify(PG);
  Object.assign(PG, JSON.parse(SP.snap)); startStage(si); SP.g1=G; SP.g1.done=0; spSeedPlayer(SP.g1,SP.code);
  Object.assign(PG, JSON.parse(SP.snap)); startStage(si); SP.g2=G; SP.g2.done=0; spSeedPlayer(SP.g2,SP.code);
  G=SP.g1; scr='play'; hideAll(); last=0;
}
function dualSim(dt){
  if(!SP.g1.done){ G=SP.g1; update(dt); }
  if(SP.on&&!SP.g2.done){ G=SP.g2; update(dt); }   // SP.on: g1 có thể vừa kết thúc trận
}
function drawSplitHalf(g,idx){
  G=g; KX=g.kx;
  const tgt=Math.max(0,Math.min(250, g.kid.y-130));   // camera bám nhân vật (cửa sổ cao 250, không méo)
  g._camY = g._camY===undefined ? tgt : g._camY+(tgt-g._camY)*0.18;
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,idx*(H/2),W,H/2); ctx.clip();
  ctx.setTransform(RS,0,0,RS,0,(idx*(H/2)-g._camY)*RS);   // cắt cửa sổ + bám nhân vật — KHÔNG ép dẹt
  drawWorld();
  ctx.restore();
}
function drawSplitHud(idx){
  const g=idx===0?SP.g1:SP.g2, s=ST[SP.si], yTop=idx*(H/2);
  ctx.setTransform(RS,0,0,RS,0,0); ctx.save(); ctx.textBaseline='top';
  if(g.done){ ctx.fillStyle='rgba(8,14,28,.5)'; ctx.fillRect(0,yTop,W,H/2); }   // mờ nửa đã xong
  ctx.fillStyle=idx===0?'#3FA9FF':'#FF5A6E'; ctx.font='900 19px Segoe UI, system-ui, sans-serif';
  const hs='❤'.repeat(Math.max(0,g.hearts))+'🤍'.repeat(Math.max(0,g.maxH-g.hearts));
  ctx.fillText((idx===0?'P1  ':'P2  ')+hs, 14, yTop+8);
  ctx.font='800 13px Segoe UI, system-ui, sans-serif'; ctx.fillStyle=skin===1?'#fff':'#22306E';
  ctx.fillText(idx===0?'⌨️ Mũi tên + ⇧/  đánh':'⌨️ W A S D + F  ·  🎮 tay cầm', 14, yTop+31);
  ctx.textAlign='right';
  ctx.fillText(g.done?'✓ XONG — chờ người kia':(s.boss?'TRÙM':Math.floor(g.dist)+'m / '+s.goal+'m'), W-14, yTop+31);
  ctx.textAlign='left'; ctx.restore();
}
function drawSplit(){
  ctx.setTransform(RS,0,0,RS,0,0); ctx.clearRect(0,0,W,H);
  const sv=G, sk=KX;
  drawSplitHalf(SP.g1,0);
  drawSplitHalf(SP.g2,1);
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.fillStyle='#0c1424'; ctx.fillRect(0,H/2-2,W,4);   // vạch chia giữa
  drawSplitHud(0); drawSplitHud(1);
  G=sv; KX=sk;
}
function splitEnd(win,fell){                            // endStage gọi khi 1 người kết thúc
  const pl=(G===SP.g1)?0:1;
  SP.res[pl]={ win:!!win, dist:Math.floor(G.dist), coins:G.coins,
    time:Math.round(G.t*10)/10, score:G.score, fell:!!fell };
  G.done=1;
  if(SP.g1.done&&SP.g2.done){ SP.on=false; Object.assign(PG, JSON.parse(SP.snap)); splitResult(); }
}
function splitResult(){

function splitAbort(){

}
// Định tuyến phím cho 2 người (chỉ khi đang chia màn).
const SP_KEYS={ ArrowLeft:[1,'L'],ArrowRight:[1,'R'],ArrowUp:[1,'J'],ArrowDown:[1,'D'],
  Slash:[1,'A'],ShiftRight:[1,'A'],
  KeyA:[2,'L'],KeyD:[2,'R'],KeyW:[2,'J'],KeyS:[2,'D'],KeyF:[2,'A'],ShiftLeft:[2,'A'] };
function splitKey(code,down,repeat){
  const m=SP_KEYS[code]; if(!m) return false;
  const g=(m[0]===1?SP.g1:SP.g2), act=m[1];
  if(g&&!g.done){ const s=G; G=g;
    if(act==='J'){ if(down){ repeat?(G.hold=true):jump(); } else release(); }  // giữ để nhảy cao
    else if(act==='A'){ if(down&&!repeat) attack(); }
    else setMove(act,down?1:0);
    G=s; }
  return true;
}

     en:JG?enMax():0, enM:JG?enMax():0, vine:null, leafT:2.0,
     wm:IC?Math.min(s.wm+PG.torch*12,wmMax()):0,
     wmM:IC?Math.min(s.wm+PG.torch*12,wmMax()):0, wmT:0, frz:0, fireT:2.5,
     o2:WT?Math.min(s.o2+PG.tank*14,o2max()):0,
     o2m:WT?Math.min(s.o2+PG.tank*14,o2max()):0, o2T:0, bubT:2.5,
     atk:0,atkCd:0,atkId:0,
     boss:s.boss?{kind:s.boss,x:660,y:s.water?230:((s.ice||s.sewer||s.jungle)?GY-120:150),vy:40,
       hp:Math.round(({kraken:22,robot:26,titan:32,rat:38,monkey:42}[s.boss]||BOSSHP)*DIFF[SET.diff].boss),
       max:Math.round(({kraken:22,robot:26,titan:32,rat:38,monkey:42}[s.boss]||BOSSHP)*DIFF[SET.diff].boss),

  KX=180;
  if(PG.charm&&PG.cDur>0){ PG.cDur--; if(PG.cDur<=0){PG.charm=0;toast('Bùa khiên đã hết!');} save(); }
  else G.pw.sh=false;
  const dz=DF();
  if(dz.hrt){ G.maxH=Math.max(2,G.maxH+dz.hrt); G.hearts=G.maxH; G.capH=G.maxH+3; }
  G.puT*=dz.pu; G.mobT*=dz.mob;
  if(resume&&PG.run&&PG.run.si===si){
    const r=PG.run;
    G.dist=r.dist; G.score=r.score; G.coins=r.coins; G.kills=r.kills||0;
    G.hearts=Math.min(r.hearts,G.capH); if(r.o2) G.o2=r.o2;
    if(r.gv) G.gv=r.gv;
    if(r.pw){ G.pw.sh=r.pw.sh; G.pw.bal=r.pw.bal||0; G.pw.bo=r.pw.bo||0; }

  } else { PG.run=null; toast('Cửa '+s.n+': '+s.name);

      setTimeout(()=>toast('⬇️ Gặp ống thấp thì bấm nút ▼ NGỒI để chui qua'),2600); }
  scr='play'; hideAll(); last=0; updatePad();

/* ============ ĐIỀU KHIỂN ============ */
/* ════════════════════════════════════════════════════════════════
   MODULE: ĐU DÂY LEO  (vine swing)
   Chạm dây khi đang bay là bám. Bám rồi thì đu như con lắc:
   góc dao động theo trọng lực, người bám ở đầu dây.
   Bấm NHẢY để buông — buông đúng lúc đang lao tới thì bay rất xa.
   Mỗi lần bám tốn năng lượng; hết năng lượng thì không bám được.
   ════════════════════════════════════════════════════════════════ */
const VINE_COST=13;
function grabVine(o){
  if(!G||G.vine||G.en<VINE_COST) return false;
  const L=o.h;
  let a0=Math.asin(Math.max(-.9,Math.min(.9,(KX-(o.x+o.w/2))/L)));
  G.vine={o:o,L:L,ang:a0,av:1.05,t:0};
  G.en-=VINE_COST; G.kid.air=true; G.kid.vy=0;
  tone(420,.1,'triangle',.05); setTimeout(()=>tone(600,.1,'triangle',.04),70);
  for(let i=0;i<8;i++) G.fx.push({x:KX,y:G.kid.y-40,vx:rnd(-70,70),vy:rnd(-90,10),
    life:.4,max:.4,r:rnd(3,6),c:'#8FD46A'});
  return true;
}
function releaseVine(byJump){
  if(!G||!G.vine) return;
  const v=G.vine, tan=v.av*v.L;                 // vận tốc tiếp tuyến
  const k=G.kid;
  k.vy = -Math.abs(Math.cos(v.ang)*tan)*0.55 - (byJump?430:170);
  k.vy = Math.max(-820,k.vy);
  k.air=true; G.vine=null; G.jbuf=0;
  if(byJump){ sJump(); puff(6); }
}
function flipGrav(){
  if(!G||G.gvCd>0) return;
  G.gvCd=.4; G.gv*=-1; G.kid.vy=0; G.kid.air=true; G.kid.dj=0;
  tone(300,.12,'square',.05); setTimeout(()=>tone(520,.12,'square',.045),70);
  for(let i=0;i<10;i++) G.fx.push({x:KX+rnd(-18,18),y:G.kid.y-30,vx:rnd(-60,60),
    vy:rnd(-40,40)*G.gv,life:.45,max:.45,r:rnd(3,7),c:'#9BE0FF',up:G.gv<0?1:0});
}
function jump(){ if(scr!=='play')return; const k=G.kid;
  if(isSp()){
    const jv=(PG.jet?1.12:1)*(G.pw.bal>0?1.2:1);
    if(!k.air){ k.vy=-520*jv*G.gv; k.air=true; k.dj=0; G.hold=true; sJump(); puff(5); }
    else if(!k.dj){ k.dj=1; k.vy=-460*jv*G.gv; G.hold=true; sJump();
      for(let i=0;i<8;i++) G.fx.push({x:KX+rnd(-14,14),y:k.y-10*G.gv,vx:rnd(-70,70),
        vy:rnd(40,110)*G.gv,life:.4,max:.4,r:rnd(3,7),c:'#FFD84D',up:G.gv<0?1:0}); }
    return; }
  if(isJgl()){
    G.hold=true;
    if(G.vine){ releaseVine(1); return; }     // đang bám dây -> buông + bật lên
    if(G.duck) return;
    if(!k.air||G.coyote>0){ k.vy=G.pw.bal>0?-800:-640; k.air=true; G.coyote=0;
      sJump(); puff(6); }
    else G.jbuf=0.16;
    return; }
  if(isSew()){
    G.hold=true;
    if(G.duck) return;
    if(!k.air||G.coyote>0){ k.vy=G.pw.bal>0?-800:-640; k.air=true; G.coyote=0;
      sJump(); puff(6); }
    else G.jbuf=0.16;
    return; }
  if(isIce()){
    G.hold=true;
    if(!k.air||G.coyote>0){ k.vy=(G.pw.bal>0?-800:-640)*(G.frz?0.82:1);
      k.air=true; G.coyote=0; sJump(); puff(6); }
    else G.jbuf=0.16;
    return; }
  if(isW()){ G.hold=true; k.vy=Math.min(k.vy,-120); tone(660,.07,'sine',.04);
    for(let i=0;i<4;i++) G.fx.push({x:KX+rnd(-10,10),y:k.y-20,vx:rnd(-30,30),vy:rnd(-90,-40),
      life:.6,max:.6,r:rnd(2,5),c:'rgba(255,255,255,.7)',up:1});
    return; }
  if(!k.air){ k.vy=(G.pw.bal>0?-800:-640)*(PG.boots?1.12:1); k.air=true; G.hold=true; sJump(); puff(6);} }
function attack(){ if(scr!=='play')return;
  const gg=gear(), w=gg.W[gg.wi];
  if(!w.dmg){ toast('Cần mua vũ khí ở Cửa hàng!'); return; }
  if(G.atkCd>0) return;
  G.atkCd=.34; G.atk=.2; G.atkId++; sSwing();
  PG[gg.wd]--;
  if(PG[gg.wd]<=0){ PG[gg.wk]--; PG[gg.wd]=gg.DW[PG[gg.wk]];
    toast(PG[gg.wk]?('🔨 Vũ khí gãy! Còn '+gg.W[PG[gg.wk]].n):'🔨 Vũ khí gãy hoàn toàn!'); sBoom(); save(); }
}
const release=()=>{ if(G) G.hold=false; };
function setMove(dir,v){ if(!G)return;
  if(dir==='D'){ if(v&&!G.mvD&&isSp()) flipGrav();
    if(isSew()||isJgl()) G.duck=v?1:0;
    G.mvD=v; return; }
  if(dir==='L')G.mvL=v; if(dir==='R')G.mvR=v; }
/* ════════════════════════════════════════════════════════════════
   MODULE: BẢN ĐỒ PHÍM  (keymap)
   Gộp mọi cách bấm quen thuộc của game platformer trên trình duyệt:
   mũi tên • WASD • Z/X • J/K • Space • Shift • Ctrl • bàn phím số.
   Muốn thêm/bớt phím: sửa đúng bảng KEYMAP bên dưới.
   ════════════════════════════════════════════════════════════════ */
const KEYMAP={
  jump : ['Space','ArrowUp','KeyW','KeyZ','Numpad8'],
  atk  : ['KeyF','KeyJ','KeyK','KeyX','KeyE','ShiftLeft','ShiftRight','Numpad0'],
  left : ['ArrowLeft','KeyA','KeyQ','Numpad4'],
  right: ['ArrowRight','KeyD','Numpad6'],
  down : ['ArrowDown','KeyS','KeyC','ControlLeft','ControlRight','Numpad2'],
  pause: ['Escape','KeyP'],
  retry: ['KeyR'],
  mute : ['KeyM'],
  ok   : ['Enter','NumpadEnter']
};
const KEYLABEL=[
  ['⬆️ Nhảy',   'PHÍM CÁCH · W · Z · ↑ · num8'],
  ['⚔️ Đánh',   'J · K · F · X · E · SHIFT · num0'],
  ['◀ Lùi lại', 'A · Q · ← · num4'],
  ['▶ Tiến lên','D · → · num6'],
  ['▼ Ngồi / xuống','S · C · CTRL · ↓ · num2'],
  ['⏸ Tạm dừng','ESC · P'],
  ['🔄 Chơi lại cửa','R'],
  ['🔇 Tắt/bật tiếng','M'],
  ['✔️ Xác nhận','ENTER']
];
function inMap(list,c){ return list.indexOf(c)>=0; }
document.addEventListener('keydown',e=>{
  if(e.repeat && !inMap(KEYMAP.jump,e.code)) { /* giữ phím: chỉ nhảy cần lặp */ }
  const c=e.code;
  if(SP.on){ if(inMap(KEYMAP.pause,c)){ e.preventDefault(); splitAbort(); return; }
    if(splitKey(c,true,e.repeat)) e.preventDefault(); return; }   // chia màn: định tuyến 2 người
  if(inMap(KEYMAP.pause,c)){ e.preventDefault();
    if(scr==='play') pauseGame(); else if(scr==='pause') resumeGame(); return; }
  if(inMap(KEYMAP.mute,c)){ e.preventDefault();
    const on=!(SET.music||SET.sfx); SET.music=on?1:0; SET.sfx=on?1:0; save();
    toast(on?'🔊 Bật tiếng':'🔇 Tắt tiếng'); return; }
  if(inMap(KEYMAP.retry,c)&&(scr==='play'||scr==='pause'||scr==='result')&&G){
    e.preventDefault(); startStage(G.si); return; }
  if(inMap(KEYMAP.ok,c)){ e.preventDefault();
    if(scr==='pause'){ resumeGame(); }
    else if(scr==='result'){
      const nb=document.getElementById('nextBtn');
      if(nb&&nb.style.display!=='none'&&nb.onclick) nb.onclick();
      else document.getElementById('retryBtn').onclick(); }
    else if(scr==='map'){ startStage(Math.min(ST.length,PG.unlocked)-1); }
    else if(scr==='shop'||scr==='set'){ document.getElementById(
      scr==='shop'?'backBtn':'setBackBtn').onclick(); }
    return; }
  if(scr!=='play') return;
  if(inMap(KEYMAP.jump,c)){ e.preventDefault(); if(!e.repeat) jump(); else G.hold=true; }
  else if(inMap(KEYMAP.atk,c)){ e.preventDefault(); attack(); }
  else if(inMap(KEYMAP.left,c)){ e.preventDefault(); setMove('L',1); }
  else if(inMap(KEYMAP.right,c)){ e.preventDefault(); setMove('R',1); }
  else if(inMap(KEYMAP.down,c)){ e.preventDefault(); setMove('D',1); }
});
document.addEventListener('keyup',e=>{
  const c=e.code;
  if(SP.on){ splitKey(c,false,false); return; }
  if(inMap(KEYMAP.jump,c)) release();
  else if(inMap(KEYMAP.left,c)) setMove('L',0);
  else if(inMap(KEYMAP.right,c)) setMove('R',0);
  else if(inMap(KEYMAP.down,c)) setMove('D',0);
});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.ov,.tool'))return;jump();});
stage.addEventListener('pointerup',release);
function bind(id,down,up){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');down();});
  const off=()=>{el.classList.remove('on');if(up)up();};
  el.addEventListener('pointerup',off); el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
}
bind('bUp',jump,release);
bind('bDown',()=>setMove('D',1),()=>setMove('D',0));
bind('bLeft',()=>setMove('L',1),()=>setMove('L',0));
bind('bRight',()=>setMove('R',1),()=>setMove('R',0));
bind('bCrs',jump,release); bind('bCir',jump,release);
bind('bTri',attack,null); bind('bSqr',attack,null);

/* ============ HIỆU ỨNG ============ */
function puff(n){for(let i=0;i<n;i++)G.fx.push({x:KX+rnd(-14,14),y:GY-6,vx:rnd(-70,-20),vy:rnd(-60,-10),
  life:.5,max:.5,r:rnd(4,9),c:skin===1?'#C8B89A':'#ffffff'});}
function spark(x,y,c,n){for(let i=0;i<(n||10);i++){const a=rnd(0,6.28),s=rnd(60,200);
  G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.55,max:.55,r:rnd(3,7),c:c});}}
function confetti(n){const cols=['#FF7BA9','#FFD84D','#6FCF57','#22306E','#00D1C1','#FF6B35'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';
    d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;

      break; }
    case 'eel': {
      m.ct=(m.ct===undefined?rnd(1,2):m.ct)-dt;
      if(m.ct<=0 && m.x<W-30 && m.x>40){ m.ct=rnd(1.7,2.6)/sh; mobShoot(m,k,300,10,'bolt'); }
      break; }
    case 'octo': {
      m.ct=(m.ct===undefined?rnd(1.2,2.2):m.ct)-dt;
      if(m.ct<=0 && m.x<W-30 && m.x>40){ m.ct=rnd(2.2,3.4)/sh;
        mobShoot(m,k,240,14,'ink'); G.blind=Math.min(2.2,(G.blind||0)+0); }
      break; }
    case 'drone': case 'orb': {
      m.st=(m.st||rnd(0,1.6))+dt;
      if(m.st>2.1){ m.st=0; m.dash=.65; }
      if(m.dash>0){ m.dash-=dt; m.x-=280*dt;
        m.y+=((k.y-40)-(m.y+m.h/2))*Math.min(1,dt*2.6); m.by=m.y; }
      break; }
    case 'bot': case 'guard': {
      m.ct=(m.ct===undefined?rnd(.8,1.8):m.ct)-dt;
      if(m.ct<=0 && m.x<W-30 && m.x>40){
        m.ct=(m.type==='guard'?1.3:2.0)/sh;
        mobShoot(m,k,270,11,'bolt');
        if(m.type==='guard'){ setTimeout(()=>{},0);
          const cx=m.x+m.w/2, cy=m.y+m.h/2;
          [-0.35,0.35].forEach(off=>{ const ang=Math.atan2((k.y-38)-cy,(KX+4)-cx)+off;
            G.shots.push({x:cx,y:cy,r:10,vx:Math.cos(ang)*250,vy:Math.sin(ang)*250,mob:1,bolt:1}); });
        }
      }
      break; }
  }
}
function spawnMob(){
  const s=ST[G.si]; if(!s.mobs||!s.mobs.length) return;
  if(G.mobs.length>=(s.boss?3:4)) { G.mobT=1.2; return; }
  for(const o of G.obs) if(Math.abs(o.x-(W+60))<150) return;
  const type=s.mobs[(Math.random()*s.mobs.length)|0], d=MOB[type];
  const bonus=(worldOf(G.si)>0&&d.hp>=2)?DF().mhp:0;
  const m={type:type,x:W+60,w:d.w,h:d.h,hp:d.hp+bonus,mhp:d.hp+bonus,
           fly:d.fly||0,ph:rnd(0,6.28),lastHit:-1,dead:0};
  m.by = d.fly ? (ST[G.si].water?rnd(CEIL+50,GY-90):GY-140-rnd(0,50)) : GY-d.h;
  m.y=m.by; G.mobs.push(m);
  G.mobT=rnd(s.mobT*.7,s.mobT*1.3)*DF().mob;
}

/* ============ CẬP NHẬT ============ */
function update(dt){
  const s=ST[G.si]; G.t+=dt;
  const p=s.boss?0:Math.min(1,G.dist/s.goal);
  if(s.boss){ G.speed=s.sp[0]; }
  else G.speed = p<.5?lerp(s.sp[0],s.sp[1],p/.5):lerp(s.sp[1],s.sp[2],(p-.5)/.5);
  G.phase = p<.33?0:(p<.66?1:2);
  G.vspd = G.speed*(G.pw.bo>0?1.5:1)*ADM.spd*DF().sp;
  if(!s.boss) G.dist += G.vspd*dt/25;
  G.worldX += G.vspd*dt;

  const k=G.kid, bal=G.pw.bal>0, WT=!!s.water, IC=!!s.ice;
  if(IC){
    if(s.wind){
      G.windT-=dt;
      if(G.windT<=0){
        if(G.wind===0){ G.windDir=Math.random()<.5?-1:1;
          G.wind=G.windDir*rnd(140,270); G.windT=rnd(1.6,2.6);
          toast(G.windDir>0?'💨 Gió thổi tới trước!':'💨 Gió thổi ngược lại!');
          tone(90,.5,'sawtooth',.05); }
        else { G.wind=0; G.windT=rnd(3.2,5.6); } } }
    const acc=(G.frz?460:920);
    if(G.mvR) G.kvx+=acc*dt;
    if(G.mvL) G.kvx-=acc*dt;
    G.kvx+=G.wind*dt;
    G.kvx*=Math.pow(PG.cramp?0.03:0.42,dt);
    G.kvx=Math.max(-420,Math.min(420,G.kvx));
    G.kx+=G.kvx*dt;
    if(G.kx<95){G.kx=95;G.kvx=Math.max(0,G.kvx);}
    if(G.kx>340){G.kx=340;G.kvx=Math.min(0,G.kvx);}
    G.wm-=dt*(G.wind?1.5:1);
    if(G.wm<=0){ G.wm=0; G.frz=1; G.wmT-=dt;
      if(G.wmT<=0){ G.wmT=3.0; if(G.inv<=0){ G.hearts--; G.inv=1.0; G.shake=.3; sHit();
        toast('🥶 Lạnh cóng! Tìm lửa 🔥'); if(G.hearts<=0){ endStage(false); return; } } } }
    else G.frz=0;
    G.fireT-=dt;
    if(G.fireT<=0){ G.fireT=rnd(5.5,8.0);
      G.items.push({x:W+40,y:GY-rnd(40,150),r:20,kind:'fire',got:0,sp:0}); }
    if(Math.random()<dt*22) G.fx.push({x:rnd(0,W),y:-6,vx:-G.vspd*.35+G.wind*.5,vy:rnd(40,90),
      life:2.4,max:2.4,r:rnd(2,4.5),c:'rgba(255,255,255,.85)'});
  } else if(!s.jungle){
    const tgt = 180 + (G.mvR?105:0) - (G.mvL?60:0);
    G.kx += (tgt-G.kx)*Math.min(1,dt*7);
  } else {
    if(!G.vine){ const tgt = 180 + (G.mvR?105:0) - (G.mvL?60:0);
      G.kx += (tgt-G.kx)*Math.min(1,dt*6); }
  }
  KX=G.kx;
  if(WT){
    const fin=PG.fins?1.28:1, bo=bal?1.35:1;
    const tv = G.mvD ? 300*fin : (G.hold ? -235*fin*bo : 165);
    k.vy += (tv-k.vy)*Math.min(1,dt*5.2);
    k.y += k.vy*dt;
    if(k.y>=GY){ k.y=GY; k.vy=0; k.air=false; }
    else { k.air=true; if(k.y<CEIL){ k.y=CEIL; k.vy=Math.max(0,k.vy); } }
    if(Math.random()<dt*9) G.fx.push({x:KX+rnd(4,18),y:k.y-58,vx:rnd(-8,12),vy:rnd(-70,-40),
      life:.8,max:.8,r:rnd(2,5),c:'rgba(255,255,255,.75)',up:1});
    if(!ADM.o2) G.o2-=dt;
    if(G.o2<=0){ G.o2=0; G.o2T-=dt;
      if(G.o2T<=0){ G.o2T=2.6; if(G.inv<=0){ G.hearts--; G.inv=1.0; G.shake=.3; sHit();
        toast('😵 Hết hơi! Tìm bong bóng khí 🫧'); if(G.hearts<=0){ endStage(false); return; } } } }
    G.bubT-=dt;
    if(G.bubT<=0){ G.bubT=rnd(5.2,7.6);
      G.items.push({x:W+40,y:rnd(CEIL+40,GY-60),r:19,kind:'bubble',got:0,sp:0}); }
  } else if(s.jungle){
    // năng lượng
    G.en=Math.min(G.enM,G.en+(k.air?0.6:2.6)*dt);
    G.leafT-=dt;
    if(G.leafT<=0){ G.leafT=rnd(3.4,5.4);
      G.items.push({x:W+40,y:GY-rnd(50,190),r:19,
        kind:Math.random()<.5?'leaf':'fruit',got:0,sp:0}); }
    if(G.vine){                                  // ĐANG ĐU DÂY
      const v=G.vine; v.t+=dt;
      v.av += -(2100/v.L)*Math.sin(v.ang)*dt;
      v.av *= Math.pow(0.985,dt*60);
      v.ang += v.av*dt;
      const ax=v.o.x+v.o.w/2, ay=VTOP+10;
      G.kx = ax + Math.sin(v.ang)*v.L;
      k.y  = ay + Math.cos(v.ang)*v.L;
      k.air=true; k.vy=0;
      G.en -= 3.0*dt;
      if(G.kx<70||G.kx>W-40||v.t>3.2||G.en<=0) releaseVine(0);
    } else {
      const prevY=k.y;
      let g=(k.vy<0&&G.hold)?(bal?620:950):(bal?1150:1900);
      if(G.mvD&&k.air) g=3400;
      k.vy+=g*dt; k.y+=k.vy*dt;
      // bám dây khi đang bay
      if(k.air&&k.vy>-260&&G.en>=VINE_COST){
        for(const o of G.obs) if(o.swing&&!o.used){
          const ax=o.x+o.w/2, r=(PG.claw?58:42);
          if(Math.abs(KX-ax)<r && k.y>VTOP+40 && k.y<VTOP+o.h+70){
            o.used=1; grabVine(o); break; }
        }
      }
      if(!G.vine){
        const fx1=KX-14, fx2=KX+14;
        let onGap=false;
        for(const o of G.obs) if(o.gap && fx2>o.x+6 && fx1<o.x+o.w-6){ onGap=true; break; }
        let floor = onGap ? 99999 : GY;
        for(const o of G.obs) if(o.plat && fx2>o.x+4 && fx1<o.x+o.w-4){
          if(prevY<=o.y+10 && k.y>=o.y) floor=Math.min(floor,o.y); }
        if(k.y>=floor){
          if(k.air) puff(3);
          k.y=floor; k.vy=0; k.air=false; G.coyote=0.13*(PG.claw?1.8:1);
          if(G.jbuf>0){ G.jbuf=0; k.vy=-640; k.air=true; sJump(); puff(5); }
        } else {
          if(!k.air&&G.coyote<=0) k.air=true;
          if(G.coyote>0) G.coyote-=dt;
        }
        if(G.jbuf>0) G.jbuf-=dt;
      }
    }
    G.kx += (180-G.kx)*Math.min(1,dt*(G.vine?0:2.2));
    if(k.y>H+70 && !G.fell){ G.fell=1; sHit(); G.shake=.5;
      toast('💀 Rơi xuống vực!'); endStage(false,1); return; }
  } else if(s.sewer){
    const prevY=k.y;
    let g=(k.vy<0&&G.hold)?(bal?620:950):(bal?1150:1900);
    k.vy+=g*dt; k.y+=k.vy*dt;
    const fx1=KX-14, fx2=KX+14;
    let onGap=false;
    for(const o of G.obs) if(o.gap && fx2>o.x+6 && fx1<o.x+o.w-6){ onGap=true; break; }
    let floor = onGap ? 99999 : GY;
    for(const o of G.obs) if(o.plat && fx2>o.x+4 && fx1<o.x+o.w-4){
      if(prevY<=o.y+10 && k.y>=o.y) floor=Math.min(floor,o.y); }
    if(k.y>=floor){
      if(k.air) puff(3);
      k.y=floor; k.vy=0; k.air=false; G.coyote=0.13*(PG.grip?2:1);
      if(G.jbuf>0){ G.jbuf=0; k.vy=-640; k.air=true; sJump(); puff(5); }
    } else {
      if(!k.air&&G.coyote<=0) k.air=true;
      if(G.coyote>0) G.coyote-=dt;
    }
    if(G.jbuf>0) G.jbuf-=dt;
    if(k.y>H+70 && !G.fell){ G.fell=1; sHit(); G.shake=.5;
      toast('💀 Rơi xuống vực!'); endStage(false,1); return; }
  } else if(s.ice){
    const prevY=k.y;
    let g=(k.vy<0&&G.hold)?(bal?620:950):(bal?1150:1900);
    if(G.mvD&&k.air) g=3400;
    k.vy+=g*dt; k.y+=k.vy*dt;
    const fx1=KX-14, fx2=KX+14;
    let onGap=false;
    for(const o of G.obs) if(o.gap && fx2>o.x+6 && fx1<o.x+o.w-6){ onGap=true; break; }
    let floor = onGap ? 99999 : GY;
    for(const o of G.obs) if(o.plat && fx2>o.x+4 && fx1<o.x+o.w-4){
      if(prevY<=o.y+10 && k.y>=o.y) floor=Math.min(floor,o.y); }
    if(k.y>=floor){
      if(k.air) puff(4);
      k.y=floor; k.vy=0; k.air=false; G.coyote=0.14*(PG.cramp?1.8:1);
      if(G.jbuf>0){ G.jbuf=0; k.vy=-640; k.air=true; sJump(); puff(5); }
    } else {
      if(!k.air&&G.coyote<=0) k.air=true;
      if(G.coyote>0) G.coyote-=dt;
    }
    if(G.jbuf>0) G.jbuf-=dt;
    if(k.y>H+70 && !G.fell){ G.fell=1; sHit(); G.shake=.5;
      toast('💀 Rơi xuống khe băng!'); endStage(false,1); return; }
  } else if(s.space){
    if(G.gvCd>0) G.gvCd-=dt;
    const gv=G.gv;
    let g=(k.vy*gv<0&&G.hold)?(bal?300:430):(bal?560:760);
    k.vy+=g*gv*dt; k.y+=k.vy*dt;
    const flr=gv>0?GY:CEIL3;
    if(gv>0 ? k.y>=flr : k.y<=flr){ if(k.air) puff(4); k.y=flr; k.vy=0; k.air=false; k.dj=0; }
    else k.air=true;
    if(gv>0 && k.y<CEIL3){ k.y=CEIL3; k.vy=Math.max(k.vy,0); }
    if(gv<0 && k.y>GY){ k.y=GY; k.vy=Math.min(k.vy,0); }
    if(PG.jet&&k.air&&Math.random()<dt*14)
      G.fx.push({x:KX+rnd(-8,8),y:k.y-6*gv,vx:rnd(-30,30),vy:rnd(60,140)*gv,
        life:.35,max:.35,r:rnd(3,6),c:Math.random()<.5?'#FFD84D':'#FF8A3D',up:gv<0?1:0});
  } else {
    let g=(k.vy<0&&G.hold)?(bal?620:950):(bal?1150:1900);
    if(G.mvD&&k.air){ g=3400; }
    k.vy+=g*dt; k.y+=k.vy*dt;
    if(k.y>=GY){ if(k.air) puff(4); k.y=GY; k.vy=0; k.air=false; }
  }
  k.ph+=dt*(G.vspd/22+2);
  if(G.inv>0)G.inv-=dt; if(G.shake>0)G.shake-=dt;
  if(G.pw.bal>0)G.pw.bal-=dt;
  if(G.atk>0)G.atk-=dt; if(G.atkCd>0)G.atkCd-=dt;
  if(G.pw.bo>0){ G.pw.bo-=dt;
    if(Math.random()<dt*30)G.fx.push({x:KX-10+rnd(-8,8),y:k.y-8,vx:rnd(-260,-140),vy:rnd(-30,20),
      life:.35,max:.35,r:rnd(4,9),c:Math.random()<.5?'#FFD84D':'#FF8A3D'}); }
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.up?-60:420)*dt;
    if(f.life<=0)G.fx.splice(i,1);}
  if(!k.air&&Math.random()<dt*13)
    G.fx.push({x:KX-14,y:GY-4,vx:-G.vspd*.6,vy:rnd(-40,-5),life:.4,max:.4,r:rnd(3,6),
      c:skin===1?'#9C7A52':'#E8DCC0'});

  const UP = s.space && G.gv<0;
  const DK = (s.sewer||s.jungle) && G.duck && !k.air;
  const kb=UP ? {x:KX-KW/2,y:k.y+6,w:KW,h:KH-6}
     : (DK ? {x:KX-KW/2,y:k.y-42,w:KW,h:36}
           : {x:KX-KW/2,y:k.y-KH,w:KW,h:KH-6});
  const gW=gear(), w=gW.W[gW.wi];
  const ab = G.atk>0 ? (WT?{x:KX+2,y:k.y-88,w:w.rng+10,h:100}
    :(UP?{x:KX+6,y:k.y+6,w:w.rng,h:60}:{x:KX+6,y:k.y-66,w:w.rng,h:60})) : null;

  function wearArmor(){
    const gg=gear(); if(!PG[gg.ak]) return;
    PG[gg.ad]--;
    if(PG[gg.ad]<=0){ PG[gg.ak]--; PG[gg.ad]=gg.DA[PG[gg.ak]];
      G.maxH=3+gg.A[PG[gg.ak]].hp; G.capH=G.maxH+3;
      G.hearts=Math.min(G.hearts,G.maxH);
      toast('💥 Giáp vỡ! Còn '+gg.A[PG[gg.ak]].n); sBoom(); }
    save();
  }
  function wearBoots(){
    if(isJgl()){ if(!PG.claw) return; PG.clDur--;
      if(PG.clDur<=0){ PG.claw=0; toast('🧗 Găng leo rách rồi!'); } save(); return; }
    if(isSew()){ if(!PG.grip) return; PG.grDur--;
      if(PG.grDur<=0){ PG.grip=0; toast('🧤 Găng bám rách rồi!'); } save(); return; }
    if(isIce()){ if(!PG.cramp) return; PG.crDur--;
      if(PG.crDur<=0){ PG.cramp=0; toast('🥾 Đế đinh mòn hết!'); } save(); return; }
    if(isSp()){ if(!PG.jet) return; PG.jDur--;
      if(PG.jDur<=0){ PG.jet=0; toast('🚀 Bộ đẩy hỏng rồi!'); } save(); return; }
    if(isW()){ if(!PG.fins) return; PG.fDur--;
      if(PG.fDur<=0){ PG.fins=0; toast('🦶 Chân vịt đã rách!'); } save(); return; }
    if(!PG.boots) return;
    PG.bDur--;
    if(PG.bDur<=0){ PG.boots=0; toast('👟 Giày lò xo đã hỏng!'); }
    save();
  }
  function hurt(px_,py_,fromObs){
    if(ADM.inv) return false;
    if(G.inv>0) return false;
    if(G.pw.sh){ G.pw.sh=false; G.inv=1.1; sBoom(); spark(KX+20,k.y-46,'#7BE0FF',14); return true; }
    G.hearts--; G.inv=1.35; G.shake=.35; sHit(); spark(px_,py_,'#FF6B6B');
    wearArmor(); if(fromObs) wearBoots();
    if(G.hearts<=0) endStage(false);
    return true;
  }

  if(!s.boss){
    G.puT-=dt; G.hpT-=dt; G.mobT-=dt;
    if(!G.want&&G.hpT<=0)G.want='heart';
    if(!G.want&&G.puT<=0)G.want='pu';
    G.spawnT-=dt; if(G.spawnT<=0) seededObs(spawnWave);
    if(G.mobT<=0) seededMob(spawnMob);
  }

  for(let i=G.obs.length-1;i>=0;i--){
    const o=G.obs[i]; o.x-=G.vspd*dt;
    if(o.fly===2)o.y=o.by+Math.sin(G.t*1.9+o.ph)*30;
    if(o.fly===3){ o.x-=110*dt; o.y+=o.vy*dt;
      if(o.y<CEIL3+20||o.y>GY-60) o.vy*=-1; }
    if(o.per!==undefined){ o.act=((G.t+o.ph)%o.per)<o.on; if(!o.act) continue; }
    if(o.type==='drip'&&(((G.t+o.ph)%2.0)>=0.9)) continue;
    if(o.gap||o.plat||o.swing) continue;
    if(o.type==='icicle'){
      if(!o.fell){
        if(o.warn===undefined) o.warn=0;
        if(o.warn<=0 && o.x-KX<250 && o.x-KX>-40){ o.warn=0.55; tone(700,.12,'triangle',.05); }
        else if(o.warn>0){ o.warn-=dt; if(o.warn<=0){ o.fell=1; o.vy=0; } }
      } else { o.vy+=1500*dt; o.y+=o.vy*dt;
        if(o.y>GY){ o.hit=1; G.shake=.15;
          for(let q=0;q<8;q++) G.fx.push({x:o.x+o.w/2,y:GY,vx:rnd(-140,140),vy:rnd(-180,-40),
            life:.45,max:.45,r:rnd(3,6),c:'#BFE8F5'}); } }
    }
    if(o.type==='snowball'){ o.x-=190*dt; o.y=GY-o.h; }
    if(o.type==='pit'){
      if(!k.air && kb.x<o.x+o.w-10 && kb.x+kb.w>o.x+10){
        if(hurt(KX,GY-20)){ k.vy=-520; k.air=true; }
        if(G.hearts<=0) return; }
      continue;
    }
    if(o.type==='whirl'){
      const cx=o.x+o.w/2, cy=o.y+o.h/2, dx=cx-KX, dy=cy-(k.y-38);
      const dd=Math.hypot(dx,dy);
      if(dd<150&&dd>4){ const f=(1-dd/150)*260;
        k.y+=dy/dd*f*dt; G.kx+=dx/dd*f*.5*dt;
        k.y=Math.max(CEIL+10,Math.min(GY,k.y)); }
      continue;
    }
    if(o.type==='gzone'){
      if(!o.used && kb.x<o.x+o.w && kb.x+kb.w>o.x && kb.y<o.y+o.h && kb.y+kb.h>o.y){
        o.used=1; flipGrav(); G.gvCd=0; toast('🌀 Vùng đảo trọng lực!'); }
      continue;
    }
    if(o.x+o.w<-70){G.obs.splice(i,1);continue;}
    if(o.hit)continue;
    if(kb.x<o.x+o.w-6&&kb.x+kb.w>o.x+6&&kb.y<o.y+o.h-4&&kb.y+kb.h>o.y+4){
      if(G.pw.bo>0){o.hit=1;G.score+=15;G.shake=.2;sBoom();
        spark(o.x+o.w/2,o.y+o.h/2,'#B9BEC7',16);G.obs.splice(i,1);continue;}
      if(hurt(KX+20,k.y-40,true)) o.hit=1;
      if(G.hearts<=0) return;
    }
  }

  for(let i=G.mobs.length-1;i>=0;i--){
    const m=G.mobs[i];
    if(m.dead){ m.dead+=dt; m.y+=120*dt; if(m.dead>.5)G.mobs.splice(i,1); continue; }
    const d=MOB[m.type];
    mobAI(m,d,dt,k);
    m.x-=(G.vspd+d.spd)*dt;
    // Dao động bay bổng CHỈ khi không lao xuống. Nếu lao (dive/dash) thì AI tự điều khiển y
    // (đã đặt m.by=m.y); cộng thêm sin lúc này sẽ tạo vòng phản hồi làm m.by trôi khỏi màn hình.
    if(m.fly && !(m.dive>0) && !(m.dash>0)) m.y=m.by+Math.sin(G.t*2.2+m.ph)*(d.amp||30);
    if(m.x+m.w<-60){G.mobs.splice(i,1);continue;}
    // đè đầu
    if(!m.fly && k.vy>0 && G.gv>0 && kb.x<m.x+m.w-4 && kb.x+kb.w>m.x+4 &&
       k.y>m.y-14 && k.y<m.y+m.h*0.7){
      m.hp=0; m.dead=.01; k.vy=-470; k.air=true;
      G.score+=d.sc; G.coins+=d.co; G.kills++; sKill(); spark(m.x+m.w/2,m.y,'#9BE870',14);
      continue;
    }
    // chém
    if(ab && m.lastHit!==G.atkId && ab.x<m.x+m.w && ab.x+ab.w>m.x && ab.y<m.y+m.h && ab.y+ab.h>m.y){
      m.lastHit=G.atkId; m.hp-=w.dmg; spark(m.x+m.w/2,m.y+m.h/2,'#FFD84D',10);
      if(m.hp<=0){ m.dead=.01; G.score+=d.sc; G.coins+=d.co; G.kills++; sKill(); onMobDie(m); }
      else sBoom();
      continue;
    }
    if(kb.x<m.x+m.w-4&&kb.x+kb.w>m.x+4&&kb.y<m.y+m.h-4&&kb.y+kb.h>m.y+4){
      if(G.pw.bo>0){ m.dead=.01; G.score+=d.sc; G.coins+=d.co; sBoom(); continue; }
      if(hurt(KX+20,k.y-40)) m.x-=30;
      if(G.hearts<=0) return;
    }
  }

  const MAG = s.space && PG.mag;
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i]; it.x-=G.vspd*dt;
    if(MAG&&!it.got){
      const dx0=(KX+8)-it.x, dy0=(k.y-38*G.gv)-it.y, d0=Math.hypot(dx0,dy0);
      if(d0<190&&d0>1){ it.x+=dx0/d0*250*dt; it.y+=dy0/d0*250*dt; }
    }
    if(it.got){it.sp+=dt;if(it.sp>.4)G.items.splice(i,1);continue;}
    if(it.x<-60){G.items.splice(i,1);continue;}
    const dx=Math.max(kb.x-it.x,0,it.x-(kb.x+kb.w)), dy=Math.max(kb.y-it.y,0,it.y-(kb.y+kb.h));
    if(dx*dx+dy*dy<(it.r+8)*(it.r+8)){
      it.got=1;
      if(it.kind==='star'){G.score+=10;G.coins+=2;sCoin();spark(it.x,it.y,'#FFD84D');}
      else if(it.kind==='cake'){G.score+=20;G.coins+=4;sCoin();spark(it.x,it.y,'#E8A33D');}
      else if(it.kind==='gem'){G.score+=50;G.coins+=10;sCoin();spark(it.x,it.y,'#7BE0FF');}
      else if(it.kind==='heart'){ if(G.hearts<G.capH){G.hearts++;G.score+=20;}else{G.score+=60;G.coins+=6;}
        sLife();spark(it.x,it.y,'#FF6B9D',18);}
      else if(it.kind==='leaf'||it.kind==='fruit'){
        G.en=Math.min(G.enM,G.en+(it.kind==='leaf'?22:38)); G.score+=12; G.coins+=3;
        tone(660,.09,'triangle',.05); spark(it.x,it.y,it.kind==='leaf'?'#8FD46A':'#FFC83D',14);}
      else if(it.kind==='fire'){ G.wm=Math.min(G.wmM,G.wm+13); G.score+=10; G.coins+=2;
        tone(520,.1,'sawtooth',.05); spark(it.x,it.y,'#FF8A3D',14);}
      else if(it.kind==='bubble'){ G.o2=Math.min(G.o2m,G.o2+11); G.score+=10; G.coins+=2;
        tone(880,.1,'sine',.05); setTimeout(()=>tone(1180,.12,'sine',.04),60);
        spark(it.x,it.y,'rgba(255,255,255,.9)',12);}
      else if(it.kind==='shield'){G.pw.sh=true;G.score+=30;sPU();spark(it.x,it.y,'#7BE0FF',16);}
      else if(it.kind==='balloon'){G.pw.bal=10;G.score+=30;sPU();spark(it.x,it.y,'#FF7BA9',16);}
      else{G.pw.bo=7;G.score+=30;sPU();spark(it.x,it.y,'#FF8A3D',16);}
    }
  }

  // ĐẠN (của boss lẫn quái)
  for(let i=G.shots.length-1;i>=0;i--){
    const f=G.shots[i]; f.x+=f.vx*dt; if(f.vy) f.y+=f.vy*dt;
    if(f.grav){ f.vy+=f.grav*dt; }
    if(f.x<-60||f.y<-60||f.y>H+60){G.shots.splice(i,1);continue;}
    const dx=Math.max(kb.x-f.x,0,f.x-(kb.x+kb.w)), dy=Math.max(kb.y-f.y,0,f.y-(kb.y+kb.h));
    if(dx*dx+dy*dy<(f.r+6)*(f.r+6)){
      G.shots.splice(i,1); spark(f.x,f.y,f.ink?'#B44DD9':(f.bolt?'#4DD9FF':'#FF8A3D'),14);
      if(hurt(KX+20,k.y-40)){} if(G.hearts<=0) return;
    }
  }

  /* ---- BOSS ---- */
  if(s.boss){
    const B=G.boss;
    // Giai đoạn tính theo TỈ LỆ máu (trước đây là số tuyệt đối 8/4 từ hồi con
    // rồng chỉ có 9 máu -> trùm 42 máu ở giai đoạn 1 gần như suốt trận).
    // Và chỉ TĂNG, không lùi, để trùm hồi máu không nhảy ngược về giai đoạn dễ.
    const fr=B.hp/B.max;
    const newPh = Math.max(B.ph||1, fr>0.66?1:(fr>0.33?2:3));
    if(newPh!==B.ph){ B.ph=newPh; sRoar(); G.shake=.6; toast('🐲 Rồng nổi giận! Giai đoạn '+newPh);
      for(let i=0;i<3;i++) spark(B.x+rnd(-60,60),B.y+rnd(-30,30),'#FF6B35',12); }
    G.hpT-=dt;
    if(G.hpT<=0){ G.hpT=11;
      G.items.push({x:W+50,y:GY-108,r:26,kind:'heart',got:0,sp:0}); }
    // quái con + vật cản từ giai đoạn 2
    if(B.ph>=2){
      G.mobT-=dt;
      if(G.mobT<=0){ seededMob(spawnMob); G.mobT=(B.ph===3?rnd(1.0,1.7):rnd(1.9,2.7))*DF().mob; }
      G.spawnT-=dt; if(G.spawnT<=0) seededObs(spawnWave);
    }
    // cột lửa
    B.pt-=dt;
    if(B.ph>=2 && B.pt<=0){
      const n = B.ph===3 ? (Math.random()<.6?3:2) : (Math.random()<.4?2:1);
      for(let i=0;i<n;i++)
        G.pil.push({x:Math.max(110,Math.min(330, KX+rnd(-40,70)+i*130)),t:0,st:'warn',
                    warn: B.ph===3?0.72:0.95});
      B.pt = (B.ph===3 ? rnd(2.0,2.9) : rnd(3.4,4.6))/DF().shot;
      tone(120,.25,'sawtooth',.05);
    }
    for(let i=G.pil.length-1;i>=0;i--){
      const pl=G.pil[i]; pl.t+=dt;
      if(pl.st==='warn'){ if(pl.t>=pl.warn){ pl.st='fire'; pl.t=0; G.shake=.25;
        tone(90,.35,'sawtooth',.06); } }
      else{
        if(pl.t>.08 && kb.x<pl.x+26 && kb.x+kb.w>pl.x-26 && kb.y+kb.h>GY-186){
          if(hurt(pl.x,GY-60)){} if(G.hearts<=0) return;
        }
        if(pl.t>.8) G.pil.splice(i,1);
      }
    }
    B.mt-=dt; if(B.hurt>0)B.hurt-=dt;
    if(B.mode==='fly'){
      const spd=[0,1,1.35,1.75][B.ph];
      B.y+=B.vy*spd*dt; if(B.y<86){B.y=86;B.vy=Math.abs(B.vy);} if(B.y>256){B.y=256;B.vy=-Math.abs(B.vy);}
      B.x+=(660-B.x)*Math.min(1,dt*1.6)+Math.sin(G.t*1.1)*14*dt;
      const KR=B.kind==='kraken', RB=B.kind==='robot', TT=B.kind==='titan', RA=B.kind==='rat',
            MK=B.kind==='monkey';
      if(MK){
        B.noHit+=dt;
        // Giai đoạn 3 hắn KIỆT SỨC, không hồi được nữa -> luôn có đường thắng
        const canRegen = B.ph<3 && B.hp<B.max;
        if(canRegen && B.noHit>4.5){
          B.regen=(B.regen===undefined?0:B.regen)-dt;
          if(B.regen<=0){ B.regen=2.2;
            B.hp=Math.min(B.max,B.hp+1); G.shake=.12; tone(600,.12,'sine',.05); }
        } else B.regen=0;
      }
      if(RA&&B.ph>=2){ B.rz=(B.rz===undefined?3.5:B.rz)-dt;
        if(B.rz<=0){ B.rz=B.ph===3?rnd(2.2,3.2):rnd(3.6,5.0);
          for(let q=0;q<(B.ph===3?3:2);q++)
            G.mobs.push({type:'roach',x:W+40+q*70,y:GY-26,by:GY-26,w:48,h:26,hp:1,mhp:1,
              fly:0,ph:rnd(0,6.28),lastHit:-1,dead:0});
          toast('🐀 Chuột chúa gọi bầy gián!'); } }
      if(TT&&B.ph>=2){ B.bz=(B.bz===undefined?5:B.bz)-dt;
        if(B.bz<=0){ B.bz=rnd(5,7); G.wind=(Math.random()<.5?-1:1)*rnd(200,330);
          G.windT=2.4; toast('🌬️ Ma Vương thổi bão tuyết!'); tone(80,.6,'sawtooth',.06); } }
      if(TT&&B.ph===3){ G.wm=Math.max(0,G.wm-dt*1.6); }
      if(KR&&B.ph===3){ G.kx=Math.min(300,G.kx+34*dt);
        G.kid.y += ((B.y)-(G.kid.y-38))*Math.min(1,dt*.55); }
      if(RB&&B.ph===3){ B.fz=(B.fz===undefined?4:B.fz)-dt;
        if(B.fz<=0){ B.fz=rnd(4.5,6.5); flipGrav(); G.gvCd=0;
          toast('⚡ Robot đảo trọng lực của bé!'); } }
      const LV3=KR?[CEIL+70,238,GY-52]:(RB?[CEIL3+60,250,GY-56]
              :((TT||RA)?[GY-44,GY-120,GY-200]:[GY-46,GY-116,GY-186]));
      if(B.mt<=0){
        if(B.ph===3 && Math.random()<.45){
          LV3.forEach((yy,j)=> G.shots.push({x:B.x-10+j*14,y:yy,r:16,vx:-330-j*18,
            ink:KR?1:0,bolt:RB?1:0,snow:TT?1:0,slime:RA?1:0}));
        } else if(B.ph===2 && Math.random()<.4){
          G.shots.push({x:B.x-10,y:LV3[0],r:17,vx:-330,ink:KR?1:0,bolt:RB?1:0,snow:TT?1:0,slime:RA?1:0});
          G.shots.push({x:B.x+16,y:LV3[2],r:17,vx:-300,ink:KR?1:0,bolt:RB?1:0,snow:TT?1:0,slime:RA?1:0});
        } else {
          const low=Math.random()<.55;
          if(MK){                                // ném chuối / dưa / hạt / phun lửa
            const r0=Math.random();
            if(B.ph===3&&r0<.3){ for(let q=0;q<3;q++)
              G.shots.push({x:B.x-30,y:GY-40-q*10,r:15,vx:-360-q*20,vy:-40+q*30,
                grav:260,mob:0,flame:1}); }
            else if(r0<.4) G.shots.push({x:B.x-20,y:B.y,r:22,vx:-250,vy:-190,grav:420,melon:1});
            else if(r0<.75) G.shots.push({x:B.x-20,y:B.y,r:15,vx:-300,vy:-140,grav:380,banana:1});
            else for(let q=-1;q<=1;q++)
              G.shots.push({x:B.x-20,y:B.y,r:10,vx:-330,vy:q*110,nut:1});
          } else
          G.shots.push({x:B.x-10,y:low?LV3[2]:LV3[1],r:17,vx:-300-B.ph*22,ink:KR?1:0,
            bolt:RB?1:0,snow:TT?1:0,slime:RA?1:0});
        }
        tone(180,.2,'sawtooth',.05);
        B.mt=[0,1.7,1.3,0.95][B.ph]/DF().shot;
        if(Math.random()<[0,.45,.42,.4][B.ph]){ B.mode='dive'; B.dt=0; B.mt=1.4; sRoar(); G.shake=.25; }
      }
    } else {
      B.dt+=dt;
      const tx=300, ty= B.kind==='kraken'?Math.max(CEIL+50,Math.min(GY-70,G.kid.y-10))
                      : B.kind==='robot' ?(G.gv>0?GY-70:CEIL3+70)
                      : B.kind==='titan' ? GY-92
                      : B.kind==='rat'   ? GY-70
                      : B.kind==='monkey'? GY-78 : GY-64;
      B.x+=(tx-B.x)*Math.min(1,dt*2.4); B.y+=(ty-B.y)*Math.min(1,dt*2.4);
      if(B.dt>[0,1.85,1.5,1.15][B.ph]){ B.mode='fly'; B.vy=40; }
    }
    const bb={x:B.x-70,y:B.y-46,w:140,h:92};
    if(ab && B.mode==='dive' && B.lastHit!==G.atkId &&
       ab.x<bb.x+bb.w && ab.x+ab.w>bb.x && ab.y<bb.y+bb.h && ab.y+ab.h>bb.y){
      B.lastHit=G.atkId; B.hp-=w.dmg; B.hurt=.35; G.shake=.3; sBoom();
      B.noHit=0; B.regen=0;
      spark(bb.x+20,bb.y+40,'#FFD84D',20);
      if(B.ph>=2){ const KR2=B.kind==='kraken';
        for(let q=-1;q<=1;q++) G.shots.push({x:B.x-30,y:B.y+q*46,r:14,
          vx:-320,vy:q*70,ink:KR2?1:0,bolt:B.kind==='robot'?1:0}); }
      if(B.hp<=0){ endStage(true); return; }
      B.mode='fly'; B.vy=-60;
    }
    if(kb.x<bb.x+bb.w&&kb.x+kb.w>bb.x&&kb.y<bb.y+bb.h&&kb.y+kb.h>bb.y){
      if(hurt(KX+20,k.y-40)){} if(G.hearts<=0) return;
    }
  } else if(G.dist>=s.goal) endStage(true);
}

function endStage(win,fell){
  if(VS.on){ vsCapture(win,fell); return; }        // đang đấu → sang luồng so kết quả
  if(SP.on){ splitEnd(win,fell); return; }         // đang chia màn → đánh dấu người này xong
  const s=ST[G.si];
  scr='result'; PG.run=null;
  const bonus=win?s.coin:Math.floor(s.coin*0.4);
  const earn=G.coins+bonus;
  PG.coins+=earn;
  if(win){ PG.cleared[s.n]=true;
    const nx=Math.min(ST.length,s.n+1);
    if(PG.unlocked<nx) PG.unlocked=nx; }
  save();
  document.getElementById('rIcon').textContent=win?'🏆':(fell?'🕳️':'💪');
  document.getElementById('rTitle').textContent=win
    ? (s.boss?'HẠ ĐƯỢC TRÙM! Con là anh hùng!':'Qua cửa '+s.n+' rồi!')
    : (fell?'Rơi xuống vực rồi! Nhảy sớm hơn nhé':'Hết tim mất rồi, thử lại nhé!');
  document.getElementById('rBody').innerHTML=
    `${s.boss?'':'Quãng đường <b>'+Math.floor(G.dist)+'m</b> / '+s.goal+'m<br>'}`+
    `Điểm: <b>${G.score}</b> • Hạ quái: <b>${G.kills}</b><br>`+
    `Xu nhận được: <b style="color:#B87300">🪙 ${earn}</b> (thưởng ${bonus})<br>`+
    `Tổng xu: <b style="color:#B87300">🪙 ${PG.coins}</b>`;
  document.getElementById('nextBtn').style.display=(win&&G.si<ST.length-1)?'':'none';
  const sb=document.getElementById('shopResBtn');
  if(sb) sb.innerHTML='🛒 Cửa hàng &nbsp;<b>🪙'+PG.coins+'</b>';
  show('resScr'); refreshMap();
  if(win){sWin();confetti(s.boss?70:30);} else confetti(8);
}

/* ============ VẼ CẢNH ============ */
function cloudA(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();
  ctx.arc(x,y,26*s,0,6.3);ctx.arc(x+26*s,y-12*s,32*s,0,6.3);
  ctx.arc(x+58*s,y+2*s,24*s,0,6.3);ctx.arc(x+30*s,y+14*s,26*s,0,6.3);ctx.fill();}
function sceneVector(t,vn){
  const sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,t.sky[0]);sky.addColorStop(1,t.sky[1]);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GY);
  ctx.fillStyle=t.sun.g;ctx.beginPath();ctx.arc(t.sun.x,t.sun.y,t.sun.r*1.5,0,6.3);ctx.fill();
  ctx.fillStyle=t.sun.c;ctx.beginPath();ctx.arc(t.sun.x,t.sun.y,t.sun.r,0,6.3);ctx.fill();
  let off=(WX()*0.15)%320;
  for(let i=-1;i<4;i++)cloudA(i*320-off+40,66+((i+9)%3)*36,.75+((i+9)%2)*.3,t.cloud);
  if(vn){ // đàn cò
    off=(WX()*0.2)%260;
    for(let i=-1;i<5;i++){const x=i*260-off+30,y=120+((i+7)%3)*26;
      ctx.strokeStyle='#FFFFFF';ctx.lineWidth=3;
      for(let j=0;j<3;j++){ctx.beginPath();
        ctx.moveTo(x+j*22,y+j*8);ctx.quadraticCurveTo(x+8+j*22,y-7+j*8,x+16+j*22,y+j*8);ctx.stroke();}}
  }
  off=(WX()*0.3)%520;
  for(let i=-1;i<4;i++){const x=i*520-off;
    ctx.fillStyle=t.hill2;ctx.beginPath();ctx.moveTo(x+240,HZ);
    ctx.quadraticCurveTo(x+380,HZ-118,x+540,HZ);ctx.closePath();ctx.fill();
    ctx.fillStyle=t.hill;ctx.beginPath();ctx.moveTo(x,HZ);
    ctx.quadraticCurveTo(x+150,HZ-152,x+320,HZ);ctx.closePath();ctx.fill();}
  off=(WX()*0.5)%400;
  for(let i=-1;i<4;i++){const b=Math.abs(Math.floor((WX()*0.5)/400)+i);
    if(vn){ vnHouse(i*400-off+20,b,t); vnBamboo(i*400-off+250,b); }
    else { house(i*400-off+20,b,t); house(i*400-off+222,b+2,t); }}
  off=(WX()*0.72)%176;
  for(let i=-1;i<8;i++){const x=i*176-off;
    ctx.fillStyle=t.fence[0];ctx.fillRect(x,HZ-64,9,64);
    ctx.fillStyle=t.fence[1];ctx.fillRect(x-88,HZ-52,176,9);ctx.fillRect(x-88,HZ-30,176,9);}
  off=(WX()*0.86)%44;
  for(let i=-1;i<24;i++){const x=i*44-off;
    ctx.fillStyle=t.bush;ctx.beginPath();ctx.arc(x,GY-2,22,Math.PI,0);ctx.fill();
    ctx.fillStyle=t.bush2;ctx.beginPath();ctx.arc(x+12,GY-2,16,Math.PI,0);ctx.fill();}
  ctx.fillStyle=t.dirt;ctx.fillRect(0,GY,W,30);
  ctx.fillStyle=t.dirt2;off=WX()%70;
  for(let i=-1;i<15;i++)ctx.fillRect(i*70-off,GY+16,34,7);
  ctx.fillStyle=t.grass;ctx.fillRect(0,GY+30,W,H-GY-30);
  ctx.fillStyle=t.grass2;off=WX()%56;
  for(let i=-1;i<18;i++){const x=i*56-off;ctx.beginPath();
    ctx.moveTo(x,H);ctx.lineTo(x+9,GY+34);ctx.lineTo(x+18,H);ctx.closePath();ctx.fill();}
}
function house(x,i,t){const w=108+(i%3)*26,h=86+(i%4)*18,b=HZ;
  ctx.fillStyle=t.wall;ctx.fillRect(x,b-h,w,h);
  ctx.fillStyle=t.roofs[i%t.roofs.length];
  ctx.beginPath();ctx.moveTo(x-12,b-h);ctx.lineTo(x+w/2,b-h-40);ctx.lineTo(x+w+12,b-h);ctx.closePath();ctx.fill();
  ctx.fillStyle=t.win;ctx.fillRect(x+16,b-h+22,30,26);ctx.fillRect(x+w-46,b-h+22,30,26);
  ctx.fillStyle='#8B5E3C';ctx.fillRect(x+w/2-13,b-34,26,34);}
function vnHouse(x,i,t){const w=150,h=70,b=HZ;
  ctx.fillStyle='#F0E2C4';ctx.fillRect(x,b-h,w,h);
  ctx.fillStyle=t.roofs[i%t.roofs.length];
  ctx.beginPath();ctx.moveTo(x-20,b-h);ctx.lineTo(x+w/2,b-h-46);ctx.lineTo(x+w+20,b-h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
  for(let j=1;j<6;j++){ctx.beginPath();ctx.moveTo(x-20+j*28,b-h);ctx.lineTo(x+w/2,b-h-46);ctx.stroke();}

/* ════════════════════════════════════════════════════════════════

const DORA={sky:'#6FC9F5',cloud:'#FFFFFF',ink:'#1E1E28',

  win:'#8FD4F5',winFr:'#FFFFFF',door:'#8A5A2E',

  road:'#CFCABC',roadLn:'#F2EEE2',grass:'#7ED957',grassD:'#5FBF3E',pipe:'#C6C6CE'};
function inkPath(fill,lw){ ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=DORA.ink; ctx.lineWidth=lw||3; ctx.stroke(); }
function jpCloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,24*s,Math.PI*.5,Math.PI*1.5);
  ctx.arc(x+24*s,y-20*s,26*s,Math.PI,Math.PI*1.85);
  ctx.arc(x+58*s,y-8*s,22*s,Math.PI*1.3,Math.PI*.4);
  ctx.arc(x+30*s,y+6*s,24*s,Math.PI*1.7,Math.PI*.5);
  ctx.closePath(); inkPath(DORA.cloud,3);
}
function jpHouse(x,i){
  const b=HZ, w=118+(i%3)*22, h=104+(i%2)*22;
  const roof=[DORA.roofA,DORA.roofB,DORA.roofC][i%3];
  ctx.beginPath(); ctx.rect(x,b-h,w,h); inkPath(DORA.wall,3);
  ctx.beginPath(); ctx.moveTo(x-13,b-h); ctx.lineTo(x+w/2,b-h-34);
  ctx.lineTo(x+w+13,b-h); ctx.closePath(); inkPath(roof,3);
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=2;
  for(let k=1;k<5;k++){ ctx.beginPath();
    ctx.moveTo(x-13+k*(w+26)/5,b-h); ctx.lineTo(x+w/2,b-h-34); ctx.stroke(); }
  // ban công tầng 2
  ctx.beginPath(); ctx.rect(x+8,b-h+34,w-16,20); inkPath(DORA.wallSh,3);
  ctx.strokeStyle=DORA.ink; ctx.lineWidth=2;

    ctx.moveTo(x+8+k*(w-16)/7,b-h+34); ctx.lineTo(x+8+k*(w-16)/7,b-h+54); ctx.stroke(); }

    ctx.beginPath(); ctx.rect(q[0],q[1],32,26); inkPath(DORA.win,3);
    ctx.strokeStyle=DORA.winFr; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(q[0]+16,q[1]); ctx.lineTo(q[0]+16,q[1]+26);
    ctx.moveTo(q[0],q[1]+13); ctx.lineTo(q[0]+32,q[1]+13); ctx.stroke(); });
  ctx.beginPath(); ctx.rect(x+w/2-15,b-34,30,34); inkPath(DORA.door,3);

  ctx.fillStyle=DORA.grassD; off=wx%64;
  for(let i=-1;i<17;i++){ const x=i*64-off;

function breeze(seed,amp,spd){
  const t=G?G.t:0, sp=spd||1;
  return (Math.sin(t*0.75*sp+seed)+0.42*Math.sin(t*1.63*sp+seed*1.7))*(amp||1)*0.72;
}

  ctx.lineTo(x+88,HZ-h*.86); ctx.lineTo(x+112,HZ-h*.5);

function vnPaddy(yTop,hh,off,cA,cB,rows){

function vnThatch(x,i){

  ctx.fillStyle=i%2?VNP.thatch:VNP.tile;

  ctx.quadraticCurveTo(x+w/2,b-h-52,x+w+26,b-h+6);
  ctx.quadraticCurveTo(x+w/2,b-h-20,x-26,b-h+6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=i%2?VNP.thatchD:VNP.tileD; ctx.lineWidth=2;
  for(let k=1;k<7;k++){ ctx.beginPath();

function vnBanana(x,seed){

  const sw=breeze(seed||0,5);
  [[-1,-6],[1,-2],[-1,10],[1,14],[-1,26]].forEach((d,k)=>{
    ctx.save(); ctx.translate(x+3,b-64+k*3);
    ctx.rotate(d[0]*(0.5+k*0.22)+sw*.014*d[0]);
    ctx.beginPath(); ctx.ellipse(d[0]*30,d[1],34,11,0,0,6.3); ctx.fill();

function vnCau(x,h,seed){

  ctx.strokeStyle=VNP.cau; ctx.lineWidth=7;

    ctx.beginPath(); ctx.moveTo(x+sw*2,b-h);

      x+sw*2+Math.cos(a)*46,b-h+Math.sin(a)*30+12); ctx.stroke(); }

const MCH=n=>1+Math.round(2.4+2.2*Math.sin(n*.31)+1.5*Math.sin(n*.113+1.7));

  [[0.18,1.15,T.far],[0.34,0.9,T.mid],[0.52,0.68,T.near]].forEach((L,li)=>{

  ctx.fillStyle=T.leafL; off=wx%56;

    dg.addColorStop(0,'rgba(6,18,8,0)'); dg.addColorStop(1,'rgba(6,18,8,.8)');
    ctx.fillStyle=dg; ctx.fillRect(0,0,W,H); }

function drawScene(){
